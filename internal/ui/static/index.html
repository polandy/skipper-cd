  // Pre-paint: the configured theme's dark variant is the stylesheet default
  // (baked server-side into data-theme/data-server-theme above), so only a
  // saved per-browser theme override and/or an explicit light-mode
  // preference must be applied before first paint to avoid a flash.
  // data-server-theme is left untouched — it is the "what is this
  // environment actually configured for" reference the mismatch notice
  // compares against. The override is honoured only when the theme switcher
  // is enabled (data-theme-switcher="on"); with it off the deployed theme is
  // fixed and any stale override in localStorage stays dormant.
  (function() {
    var el = document.documentElement;
    if (el.getAttribute('data-theme-switcher') === 'on') {
      var override = localStorage.getItem('themeOverride');
      if (override) el.setAttribute('data-theme', override);
    }
    if (localStorage.getItem('colorScheme') === 'light') el.classList.add('light');
  })();
</script>

<style>
  /* ---------------------------------------------------------------------
     Theme palettes. The server bakes the configured theme (ui_theme) into
     <html data-theme="…">; the header toggle only ever flips the ".light"
     class on top of it (dark/light is a per-browser preference, the theme
     itself is a per-deployment choice — see docs/configuration.md).
     Each block defines the same raw slots: four background depths
     (crust/mantle/base/surface0), three text tiers (overlay1/overlay2/
     subtext0/text), and six raw accent colours (--raw-*). The semantic
     layer further down consumes only these tokens, so adding a theme here
     is the only change needed to restyle the whole page. Fallback (bare
     :root, lowest specificity) is Catppuccin dark, in case data-theme is
     ever missing. */
  :root {
    --crust: #11111b; --mantle: #181825; --base: #1e1e2e; --surface0: #313244;
    --overlay1: #7f849c; --overlay2: #9399b2; --subtext0: #a6adc8; --text: #cdd6f4;
    --raw-accent: #fab387; --raw-success: #94e2d5; --raw-danger: #f38ba8;
    --raw-rollback: #eba0ac; --raw-diffadd: #a6e3a1; --raw-queued: #f9e2af;
    color-scheme: dark;
  }

  /* Semantic layer — everything below consumes only these tokens, so
     swapping a palette above restyles the whole page. */

    --bg-deep: var(--mantle);      /* page */
    --bg-base: var(--base);        /* header glass, cards */

    --border-lit: color-mix(in srgb, var(--overlay2) 28%, transparent);

    --danger: var(--raw-danger);
    --rollback: var(--raw-rollback);
    --skip: var(--overlay1);
    --queued: var(--raw-queued);   /* Queued/deferred deploy, autosync paused */
    --diff-add: var(--raw-diffadd);
    --hunk: var(--raw-queued);
    --accent-dim: color-mix(in srgb, var(--accent) 12%, transparent);
    --accent-glow: color-mix(in srgb, var(--accent) 30%, transparent);
    --success-dim: color-mix(in srgb, var(--success) 12%, transparent);
    --danger-dim: color-mix(in srgb, var(--danger) 10%, transparent);
    --rollback-dim: color-mix(in srgb, var(--rollback) 12%, transparent);
    --queued-dim: color-mix(in srgb, var(--queued) 14%, transparent);
    --font-display: 'DM Sans', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
    --radius: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-display);
    background: var(--bg-deep);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid pattern overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(color-mix(in srgb, var(--overlay2) 7%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--overlay2) 7%, transparent) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* Ambient glow at top */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 400px;
    background: radial-gradient(ellipse, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── HEADER ─── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: color-mix(in srgb, var(--bg-base) 82%, transparent);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    /* Let the version label clip (ellipsis) instead of widening the header. */
    min-width: 0;
  }

  .brand-icon {
    width: 32px;
    height: 32px;
    position: relative;
    color: var(--text-primary);
  }

  .brand-icon svg { display: block; width: 32px; height: 32px; }

  /* Wordmark over version, stacked beside the logo. */
  .brand-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    line-height: 1.1;
  }

  .brand-name {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }

  .brand-name span {
    color: var(--accent);
  }

  .brand-version {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.2px;
    /* Sits under the wordmark; shows in full and only clips (ellipsis) when the
       column actually runs out of width — no fixed character cap. */
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .brand-version:empty { display: none; }

  .status-area {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    font-family: var(--font-mono);
  }
  /* State text lives in the element's title tooltip; only the link glyph shows. */
  .indicator span { display: none; }

  /* Connection state as a chain-link glyph: closed link when up, broken link
     when reconnecting. Colour carries the state (success/accent/danger); the
     transient states (connecting/reconnecting) animate so they don't read as a
     static error. */
  .indicator-dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--success);
    filter: drop-shadow(0 0 5px color-mix(in srgb, var(--success) 45%, transparent));
    flex-shrink: 0;
  }
  .ci-ico { display: block; width: 18px; height: 18px; }
  .indicator-dot .ci-broken { display: none; }

  .indicator-dot.warn {
    color: var(--accent);
    filter: drop-shadow(0 0 5px var(--accent-glow));
    animation: breathe 2s ease-in-out infinite;
  }

  .indicator-dot.err {
    color: var(--danger);
    filter: drop-shadow(0 0 5px color-mix(in srgb, var(--danger) 45%, transparent));
    animation: reconnect-pulse 1s ease-in-out infinite;
  }
  .indicator-dot.err .ci-link { display: none; }
  .indicator-dot.err .ci-broken { display: block; }

  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  @keyframes reconnect-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .deploy-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font-mono);
    color: var(--text-muted);
    transition: color 0.3s;
  }

  .deploy-status.active { color: var(--accent); }
  .deploy-status.active .deploy-dot {
    color: var(--accent);
    filter: drop-shadow(0 0 5px var(--accent-glow));
    animation: breathe 2s ease-in-out infinite;
  }

  /* Anchor at rest (idle, muted), ship under way when deploying (accent,
     pulsing). The glyph colour follows the indicator via currentColor. */
  .deploy-dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    transition: color 0.3s;
    flex-shrink: 0;
  }
  .ds-ico { display: block; width: 18px; height: 18px; }
  .deploy-status .ds-ship { display: none; }
  .deploy-status.active .ds-anchor { display: none; }
  .deploy-status.active .ds-ship { display: block; }
  /* No text when idle (the anchor + its title tooltip say enough); the only
     header labels that remain are the names of the stacks being deployed. */
  .deploy-status span { display: none; }
  .deploy-status.active span { display: inline; }

  /* ─── MAIN ─── */
  main {
    position: relative;
    z-index: 1;
    max-width: 1040px;
    margin: 32px auto;
    padding: 0 20px;
  }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 24px;
    color: var(--text-muted);
  }

  .empty-icon {
    width: 64px;
    height: 64px;
    margin-bottom: 20px;
    opacity: 0.3;
  }

  .empty-state p {
    font-size: 14px;
    font-family: var(--font-mono);
    letter-spacing: -0.2px;
  }

  /* ─── EVENT LIST ─── */
  .event-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .event-list-header {
    display: grid;
    grid-template-columns: 160px 1fr 110px 80px 100px;
    gap: 12px;
    padding: 0 20px 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  .event-row {
    display: grid;
    grid-template-columns: 160px 1fr 110px 80px 100px;
    gap: 12px;
    align-items: center;
    padding: 12px 20px;
    border-radius: var(--radius);
    transition: background 0.2s, transform 0.2s;
    position: relative;
  }

  .event-row:hover {
    background: color-mix(in srgb, var(--overlay2) 6%, transparent);
  }

  .event-row.new-row {
    animation: rowEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rowEnter {
    from { opacity: 0; transform: translateY(-12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Active deploy glow */
  .event-row.deploying-row {
    background: var(--accent-dim);
    border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
    margin: 2px 0;
  }

  .event-row.deploying-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .event-row.failed-row {
    background: var(--danger-dim);
  }

  .event-row.failed-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--danger);
    border-radius: 0 2px 2px 0;
  }

  .event-row.rolled_back-row {
    background: var(--rollback-dim);
  }

  /* Rollback ran but the restored version is also unhealthy — the worst
     terminal state, so it borrows the failed (danger) colours. */
  .event-row.rolled_back_unhealthy-row {
    background: var(--danger-dim);
  }

  .event-row.rolled_back_unhealthy-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--danger);
    border-radius: 0 2px 2px 0;
  }

  .event-row.rolled_back-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--rollback);
    border-radius: 0 2px 2px 0;
  }

  .event-row.queued-row {
    background: var(--queued-dim);
  }

  .event-row.queued-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--queued);
    border-radius: 0 2px 2px 0;
  }

  .paused-tag {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--queued);
    background: var(--queued-dim);
    border: 1px solid color-mix(in srgb, var(--queued) 26%, transparent);
    padding: 1px 5px;
    border-radius: 4px;
    margin-left: 8px;
    white-space: nowrap;
  }

  .event-row.success-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--success);
    border-radius: 0 2px 2px 0;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .event-row.success-row:hover::before {
    opacity: 1;
  }

  /* ─── CELLS ─── */
  .cell-time {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .cell-stack {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }

  .stack-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Recognizable per-stack icon; falls back to a monogram (.mono) when no
     image resolves. Fixed box so mixed SVG/PNG sources line up. */
  .stack-icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    overflow: hidden;
  }

  .stack-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .stack-icon.mono {
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .cell-duration {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ─── STATUS BADGES ─── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 5px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    white-space: nowrap;
    text-transform: uppercase;
  }

  .badge-success {
    background: var(--success-dim);
    color: var(--success);
    border: 1px solid color-mix(in srgb, var(--success) 20%, transparent);
  }

  .badge-failed {
    background: var(--danger-dim);
    color: var(--danger);
    border: 1px solid color-mix(in srgb, var(--danger) 20%, transparent);
  }

  .badge-deploying {
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
  }

  .badge-rolled_back {
    background: var(--rollback-dim);
    color: var(--rollback);
    border: 1px solid color-mix(in srgb, var(--rollback) 22%, transparent);
  }

  /* Rollback ran but the restored version is also unhealthy — the worst
     terminal state, so it borrows the failed (danger) colours. The full
     wording overflows the status column on one line, so the label stacks
     two lines at a reduced size (see badgeHTML). */
  .badge-rolled_back_unhealthy {
    background: var(--danger-dim);
    color: var(--danger);
    border: 1px solid color-mix(in srgb, var(--danger) 20%, transparent);
    flex-direction: column;
    gap: 0;
    font-size: 9px;
    line-height: 1.3;
    padding: 2px 8px;
  }

  .badge-queued {
    background: var(--queued-dim);
    color: var(--queued);
    border: 1px solid color-mix(in srgb, var(--queued) 30%, transparent);
  }

  .spinner {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    animation: breathe 1.4s ease-in-out infinite;
  }

  /* ─── FILES PILL ─── */
  .files-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--overlay2) 9%, transparent);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .files-pill:hover {
    background: color-mix(in srgb, var(--overlay2) 14%, transparent);
    border-color: var(--border-lit);
    color: var(--text-primary);
  }

  .files-pill svg {
    width: 12px;
    height: 12px;
    opacity: 0.5;
  }

  .files-list {
    padding: 10px 14px;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 2;
    word-break: break-all;
    animation: expand 0.2s ease-out;
  }

  @keyframes expand {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .file-path {
    padding: 1px 6px;
    border-radius: 3px;
    background: color-mix(in srgb, var(--overlay2) 9%, transparent);
    display: inline-block;
    margin: 1px 0;
  }

  /* ─── ERROR ─── */
  .error-detail {
    grid-column: 1 / -1;
    margin-top: 4px;
    padding: 10px 14px;
    background: color-mix(in srgb, var(--danger) 6%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 16%, transparent);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--danger);
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.6;
    animation: expand 0.2s ease-out;
  }

  /* ─── DIFF PANEL ─── */
  .diff-panel {
    padding: 0;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    overflow: hidden;
    animation: expand 0.2s ease-out;
  }

  .diff-file-section {
    border-bottom: 1px solid var(--border);
  }

  .diff-file-section:last-child {
    border-bottom: none;
  }

  .diff-file-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: color-mix(in srgb, var(--overlay2) 6%, transparent);
    cursor: pointer;
    user-select: none;
    font-weight: 500;
    color: var(--text-primary);
    font-size: 11px;
    transition: background 0.15s;
  }

  .diff-file-header:hover {
    background: color-mix(in srgb, var(--overlay2) 10%, transparent);
  }

  .diff-file-header svg {
    width: 10px;
    height: 10px;
    opacity: 0.5;
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .diff-file-header.expanded svg {
    transform: rotate(90deg);
  }

  .diff-content {
    display: none;
    padding: 0;
    overflow-x: auto;
    white-space: pre;
    line-height: 1.6;
  }

  .diff-file-header.expanded + .diff-content {
    display: block;
  }

  .diff-line {
    padding: 0 14px;
    display: block;
  }

  .diff-add {
    background: color-mix(in srgb, var(--diff-add) 12%, transparent);
    color: var(--diff-add);
  }

  .diff-del {
    background: color-mix(in srgb, var(--danger) 12%, transparent);
    color: var(--danger);
  }

  .diff-hunk {
    background: color-mix(in srgb, var(--hunk) 10%, transparent);
    color: var(--hunk);
    font-weight: 500;
  }

  .diff-meta {
    color: var(--text-muted);
  }

  .diff-loading {
    padding: 12px 14px;
    color: var(--text-muted);
    font-style: italic;
  }

  /* ─── SEPARATOR ─── */
  .sep {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }

  .sep::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ─── FILTER TOGGLE ─── */
  .filter-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font-mono);
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    background: none;
    border: none;
    padding: 0;
    transition: color 0.2s;
  }

  .filter-toggle:hover { color: var(--text-secondary); }

  /* Glyph-only controls on every viewport: the switch track and text label are
     dropped in favour of a single self-describing glyph (icon = identity,
     accent tint = active state), the same treatment the compact mobile row
     already used. */
  .filter-toggle span { display: none; }
  .filter-toggle .toggle-track { display: none; }

  .toggle-track {
    width: 28px;
    height: 16px;
    border-radius: 8px;
    background: var(--bg-raised);
    border: 1px solid var(--border-lit);
    position: relative;
    transition: background 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }

  .toggle-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: transform 0.2s, background 0.2s;
  }

  .filter-toggle.active .toggle-track {
    background: var(--accent-dim);
    border-color: color-mix(in srgb, var(--accent) 35%, transparent);
  }

  /* Palette-glyph picker: the native <select> keeps all its behaviour and
     accessibility but is laid transparently over an 18px palette icon, so it
     reads as one more icon control while still opening the native option list
     on click. */
  .theme-picker {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    color: var(--text-muted);
    transition: color 0.2s;
  }
  .theme-picker:hover { color: var(--text-secondary); }
  .tp-ico { display: block; width: 18px; height: 18px; pointer-events: none; }
  .theme-select {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: none;
    opacity: 0;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .theme-picker:focus-within { color: var(--text-primary); }
  .theme-select:focus-visible { outline: none; }
  .theme-picker:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  /* The theme picker is opt-in (ui_theme_switcher). With it off the deployed
     theme is fixed, so the picker is hidden entirely. */
  html[data-theme-switcher="off"] .theme-picker { display: none; }

  /* Tap-reveal label: on touch there are no hover tooltips, so a tap on any
     header control briefly shows its title in this bubble (the control's action
     still fires). Pointer/mouse users keep the native title tooltip. */
  .tap-tip {
    position: fixed;
    z-index: 200;
    pointer-events: none;
    max-width: 240px;
    padding: 5px 9px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    line-height: 1.35;
    text-align: center;
    color: var(--text-primary);
    background: color-mix(in srgb, var(--bg-base) 96%, transparent);
    backdrop-filter: blur(12px) saturate(1.2);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
    border: 1px solid var(--border-lit);
    border-radius: 8px;
    box-shadow: 0 10px 28px -10px rgba(0, 0, 0, 0.55);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .tap-tip.show { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .tap-tip { transition: opacity 0.12s ease; transform: none; }
    .tap-tip.show { transform: none; }
  }

  .theme-notice {
    position: fixed;
    z-index: 95;
    top: 66px;
    right: 14px;
    max-width: min(360px, calc(100vw - 28px));
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: color-mix(in srgb, var(--bg-base) 97%, transparent);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border: 1px solid var(--border-lit);
    border-radius: 10px;
    box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
    font-size: 12.5px;
    color: var(--text-secondary);
    animation: theme-notice-in 0.18s ease;
  }
  .theme-notice[hidden] { display: none; }
  .theme-notice-close {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 5px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .theme-notice-close:hover { color: var(--text-primary); background: var(--bg-raised); }
  @keyframes theme-notice-in {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .theme-notice { animation: none; }
  }

  .filter-toggle.active .toggle-thumb {
    transform: translateX(12px);
    background: var(--accent);
  }

  .filter-toggle.active { color: var(--accent); }

  /* Per-toggle glyph — the sole visible part of each control on every viewport.
     Colour follows the toggle (muted → accent when active) via currentColor. */
  .tg-ico { display: block; width: 18px; height: 18px; flex-shrink: 0; }
  /* Theme glyph reflects the current mode: moon in dark (default), sun in light
     (active). Sort glyph flips vertically when active (oldest-first) to signal
     the reversed order. */
  #theme-toggle .tg-sun { display: none; }
  #theme-toggle.active .tg-moon { display: none; }
  #theme-toggle.active .tg-sun { display: block; }
  #log-sort.active .tg-ico { transform: scaleY(-1); }

  /* ─── VIEW TOGGLE ─── */
  .view-toggle {
    display: flex;
    gap: 2px;
    padding: 2px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .view-toggle button {
    display: flex;
    align-items: center;
    color: var(--text-muted);
    background: none;
    border: none;
    border-radius: 4px;
    padding: 4px 8px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }
  .vt-ico { display: block; width: 17px; height: 17px; }

  .view-toggle button:hover:not(.active) { color: var(--text-secondary); }

  .view-toggle button.active {
    color: var(--accent);
    background: var(--accent-dim);
  }
  /* The active view's button opens a small options popover (below); a subtle
     caret hints at it. Absolutely positioned so toggling it never shifts the
     button's width — nothing in the header hops. */
  .view-toggle button { position: relative; }
  .view-toggle button.active::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 1px;
    transform: translateX(-50%);
    border-left: 3px solid transparent;
    border-right: 3px solid transparent;
    border-top: 3px solid currentColor;
    opacity: 0.55;
  }

  /* ─── VIEW OPTIONS POPOVER ─── */
  /* View-specific toggles (deploys: time mode; logs: sort + auto-scroll) live
     here instead of the header row, so switching views never makes controls
     appear/disappear. Opened by clicking the already-active view button;
     dismisses on outside-click / Esc, like the autosync drawer. */
  .view-switch { position: relative; display: flex; }
  .view-options {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 97;
    min-width: 190px;
    padding: 5px;
    background: color-mix(in srgb, var(--bg-base) 97%, transparent);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border: 1px solid var(--border-lit);
    border-radius: 10px;
    box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
    display: none;
  }
  .view-options.open { display: block; animation: theme-notice-in 0.16s ease; }
  .vo-group { display: none; }
  body:not(.view-logs) .view-options .vo-group[data-view="deploys"] { display: block; }
  body.view-logs .view-options .vo-group[data-view="logs"] { display: block; }

  /* Filter toggles are glyph-only in the header, but inside the popover there is
     room for the full label + switch track (like the autosync drawer rows). */
  .view-options .filter-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border-radius: 7px;
    font-size: 12px;
  }
  .view-options .filter-toggle:hover { background: var(--bg-raised); }
  .view-options .filter-toggle .tg-ico { display: block; width: 16px; height: 16px; order: 0; }
  .view-options .filter-toggle span { display: inline; margin-right: auto; order: 1; white-space: nowrap; }
  .view-options .filter-toggle .toggle-track { display: block; order: 2; }

  /* ─── AUTOSYNC HEADER CONTROL ─── */
  /* Icon-only, like the filter toggles: no box or label. Muted by default
     (nothing special happening); the glyph's colour only changes for a real
     signal — queued = paused, accent = drawer open — and the pending pill rides
     alongside it. */
  .autosync-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    color: var(--text-secondary);
    background: none;
    border: none;
    padding: 0;
  }
  .autosync-btn > span:not(.pending-count) { display: none; }
  .autosync-btn .as-ico { width: 18px; height: 18px; flex-shrink: 0; color: var(--text-muted); transition: color 0.15s; }
  .autosync-btn:hover .as-ico { color: var(--text-secondary); }
  .autosync-btn.paused .as-ico { color: var(--queued); }
  .autosync-btn.paused:hover .as-ico { color: var(--queued); }
  .autosync-btn.open .as-ico { color: var(--accent); }
  .pending-count {
    display: none;
    align-items: center;
    gap: 5px;
    font-weight: 600;
    color: var(--queued);
    background: var(--queued-dim);
    border: 1px solid color-mix(in srgb, var(--queued) 32%, transparent);
    border-radius: 20px;
    padding: 1px 8px 1px 6px;
    font-size: 11px;
    line-height: 1.6;
  }
  .autosync-btn.has-pending .pending-count { display: inline-flex; }
  .pending-count .pc-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--queued); animation: breathe 2s ease-in-out infinite; }

  /* ─── AUTOSYNC DRAWER ─── */
  .drawer {
    position: fixed;
    z-index: 90;
    top: 56px;
    right: 14px;
    width: 390px;
    max-width: calc(100vw - 28px);
    background: color-mix(in srgb, var(--bg-base) 97%, transparent);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border: 1px solid var(--border-lit);
    border-top: none;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 26px 50px -24px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    visibility: hidden;
    transition: max-height 0.22s ease, opacity 0.18s ease, visibility 0.22s;
  }
  .drawer.open { max-height: min(72vh, 640px); opacity: 1; visibility: visible; overflow-y: auto; }
  .drawer-inner { padding: 14px 16px 16px; }
  .drawer-title { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.3px; color: var(--text-primary); text-transform: uppercase; }
  .drawer-sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .drawer-sub b { color: var(--queued); font-weight: 600; }

  .global-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 12px 0 6px;
  }
  .global-row .gr-label { font-size: 13px; font-weight: 600; }
  .global-row .gr-note { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; font-family: var(--font-mono); }

  .sec-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 16px 2px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .sec-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .sec-label .sec-count { color: var(--queued); }

  .qlist { display: flex; flex-direction: column; gap: 2px; }
  .qempty { font-size: 12.5px; color: var(--text-muted); padding: 8px 4px 4px; font-family: var(--font-mono); }

  .stack-filter-wrap { position: relative; margin: 0 2px 6px; }
  .stack-filter-wrap .fi { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--text-muted); pointer-events: none; }
  .stack-filter {
    width: 100%;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-primary);
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 26px 7px 28px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .stack-filter::placeholder { color: var(--text-muted); }
  .stack-filter:focus { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .stack-filter-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; display: none; border-radius: 4px; }
  .stack-filter-clear:hover { color: var(--text-primary); }
  .stack-filter-wrap.has-value .stack-filter-clear { display: block; }

  .stack-row {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 7px;
    transition: background 0.15s;
  }
  .stack-row:hover { background: color-mix(in srgb, var(--overlay2) 6%, transparent); }
  .qpos { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--queued); background: var(--queued-dim); border-radius: 5px; text-align: center; line-height: 20px; height: 20px; }
  .qpos.blank { background: none; color: var(--text-muted); }
  .stack-meta { min-width: 0; }
  .stack-name { font-family: var(--font-mono); font-size: 13px; font-weight: 500; letter-spacing: -0.2px; display: flex; align-items: center; gap: 7px; }
  .stack-detail { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stack-detail .warn { color: var(--queued); }

  .reason { font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; }
  .reason-global { color: var(--accent); background: var(--accent-dim); border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent); }
  .reason-stack { color: var(--success); background: var(--success-dim); border: 1px solid color-mix(in srgb, var(--success) 26%, transparent); }

  .sw { width: 28px; height: 16px; border-radius: 8px; background: var(--bg-raised); border: 1px solid var(--border-lit); position: relative; cursor: pointer; flex-shrink: 0; transition: background 0.2s, border-color 0.2s; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); transition: transform 0.2s, background 0.2s; }
  .sw.on { background: var(--accent-dim); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .sw.on::after { transform: translateX(12px); background: var(--accent); }
  .sw.lg { width: 34px; height: 19px; border-radius: 10px; }
  .sw.lg::after { width: 13px; height: 13px; }
  .sw.lg.on::after { transform: translateX(15px); }

  /* ─── LOG VIEW ─── */
  /* body.view-logs switches between the deploy table and the log pane;
     !important wins over the inline display set by showTable(). */
  #log-view { display: none; }
  body.view-logs #log-view { display: block; }
  body.view-logs #deploy-table, body.view-logs #empty-state { display: none !important; }
  /* time-mode / log-sort / follow-logs now live in the view-options popover,
     shown per active view via .vo-group (see VIEW OPTIONS POPOVER). */

  .log-pane {
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.7;
    padding: 10px 0;
    height: calc(100vh - 150px);
    overflow-y: auto;
  }

  .log-empty {
    padding: 90px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  .log-line {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 0 14px;
  }

  .log-line:hover { background: color-mix(in srgb, var(--overlay2) 6%, transparent); }

  .log-time {
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .log-level {
    flex-shrink: 0;
    width: 44px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
  }

  .log-level.ERROR { color: var(--danger); }
  .log-level.WARN { color: var(--yellow); }
  .log-level.DEBUG { color: var(--skip); }

  .log-cmd {
    color: var(--skip);
    flex-shrink: 0;
  }

  .log-stack {
    color: var(--accent);
    flex-shrink: 0;
  }

  .log-diff-pill {
    flex-shrink: 0;
  }

  .log-msg {
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-all;
  }

  .log-attrs {
    color: var(--text-muted);
    word-break: break-all;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 700px) {
    header { padding: 0 12px; height: 48px; }
    .status-area { gap: 10px; }
    /* Wordmark is dropped — the ship logo alone carries the brand on mobile so
       the control row fits without horizontal scroll. The version is kept in
       portrait (re-shown below) but dropped in the tighter landscape. */
    .brand-name { display: none; }
    .brand-version { display: none; }
    /* Filter toggles are glyph-only on every viewport now (see base rules).
       Deploy-status and connection are already glyph-only via base rules; here
       we also drop the deploying stack names so the row stays glyph-only (the
       names remain in the element's title/aria — see UI_SPEC §Responsive). */
    .deploy-status.active span { display: none; }
    /* Autosync is already icon-only on every viewport (see base rules). */
    /* The theme picker doesn't fit the compact row and switching palettes is
       rarely needed on a phone; the configured theme still applies as-is. */
    .theme-picker { display: none; }
    main { margin: 16px auto; padding: 0 12px; }

    .event-list-header { display: none; }

    .event-row {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 4px 12px;
      padding: 10px 14px;
    }

    .cell-time { grid-column: 1; grid-row: 2; font-size: 11px; }
    .cell-stack { grid-column: 1; grid-row: 1; }
    .status-cell { grid-column: 2; grid-row: 1; }
    .cell-duration { grid-column: 2; grid-row: 2; text-align: right; }
    .col-files { display: none; }
    .event-row:has(.files-pill) { cursor: pointer; }
  }

  /* Portrait phones keep the build identity next to the logo. It clips with an
     ellipsis and can shrink (min-width:0) so the header never scrolls sideways;
     the full string stays available via the title tooltip / long-press. */
  @media (max-width: 700px) and (orientation: portrait) {
    .brand-version {
      display: block;
      max-width: 34vw;
      min-width: 0;
      flex-shrink: 1;
      font-size: 10px;
      margin-left: 0;
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 5 64 64" fill="none" role="img" aria-label="skipper-cd">
        <path d="M9 41 H55 L45 53 H19 Z" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
        <rect x="19" y="30" width="12" height="9" rx="2" fill="var(--accent)"/>
        <rect x="33" y="30" width="12" height="9" rx="2" stroke="currentColor" stroke-width="3"/>
        <rect x="26" y="18" width="12" height="9" rx="2" fill="var(--success)"/>
        <path d="M14 60 q5 -5 10 0 t10 0 t10 0 t10 0" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name" data-testid="brand-name">skipper<span>-cd</span></span>
      <span class="brand-version" id="brand-version" data-testid="brand-version"></span>
    </div>
  </div>
  <div class="status-area">
    <div class="deploy-status" id="deploy-status" data-testid="deploy-indicator" title="idle" aria-label="idle">
      <span>idle</span>
      <div class="deploy-dot">
        <svg class="ds-ico ds-anchor" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="5" r="2" stroke="currentColor" stroke-width="2"/><path d="M12 7v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8.5 10h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 12.5a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 12.5 3 11m2 1.5 2-1.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 12.5 21 11m-2 1.5-2-1.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ds-ico ds-ship" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 13h16l-2 4H6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><rect x="7.5" y="8" width="3.5" height="4" rx="0.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="8" width="3.5" height="4" rx="0.5" stroke="currentColor" stroke-width="1.7"/><path d="M3 20q2-1.6 4 0t4 0 4 0 4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div class="view-switch" id="view-switch">
      <div class="view-toggle" id="view-toggle" data-testid="view-toggle">
        <button data-view="deploys" class="active" title="Deploys" aria-label="Deploys" aria-haspopup="true" aria-expanded="false">
          <svg class="vt-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3.5 9.5h17M9 9.5V19" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button data-view="logs" title="Logs" aria-label="Logs" aria-haspopup="true" aria-expanded="false">
          <svg class="vt-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 9.5l3 2.5-3 2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 15H17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="view-options" id="view-options" data-testid="view-options" role="menu" aria-label="View options">
        <div class="vo-group" data-view="deploys">
          <button class="filter-toggle" id="time-mode" data-testid="time-mode" title="Switch to absolute time">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
            <svg class="tg-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Absolute time</span>
          </button>
        </div>
        <div class="vo-group" data-view="logs">
          <button class="filter-toggle" id="log-sort" data-testid="log-sort" title="Show oldest log lines first">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
            <svg class="tg-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 5v14M3 16l3 3 3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 6h9M12 11h6M12 16h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Oldest first</span>
          </button>
          <button class="filter-toggle" id="follow-logs" data-testid="follow-logs" title="Auto-scroll to newest log lines">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
            <svg class="tg-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11M8 11l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 20h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Auto-scroll</span>
          </button>
        </div>
      </div>
    </div>
    <div class="autosync-btn" id="autosync-btn" data-testid="autosync-btn" role="button" tabindex="0" aria-expanded="false" title="Autosync">
      <svg class="as-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M17 3v4h-4M7 21v-4h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>autosync</span>
      <span class="pending-count" data-testid="pending-pill"><span class="pc-dot"></span><span id="autosync-count">0</span></span>
    </div>
    <div class="theme-picker" title="UI theme (this browser only — does not change the deployed environment's theme)">
      <svg class="tp-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.4-1.1-.3-.3-.5-.7-.5-1.1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-3.9-4-6.6-9-6.6Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="7.5" cy="12" r="1.1" fill="currentColor"/><circle cx="9.5" cy="7.8" r="1.1" fill="currentColor"/><circle cx="14" cy="7.3" r="1.1" fill="currentColor"/><circle cx="17" cy="10.5" r="1.1" fill="currentColor"/></svg>
      <select class="theme-select" id="theme-select" data-testid="theme-select" title="UI theme (this browser only — does not change the deployed environment's theme)">
        <option value="catppuccin">Catppuccin</option>
        <option value="nord">Nord</option>
        <option value="solarized">Solarized</option>
        <option value="gruvbox">Gruvbox</option>

    </div>
    <button class="filter-toggle" id="theme-toggle" data-testid="theme-toggle" title="Switch to light theme">
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
      <svg class="tg-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path class="tg-moon" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><g class="tg-sun"><circle cx="12" cy="12" r="4.3" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.4 19.6l1.6-1.6M18 6l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g></svg>
      <span>light</span>
    </button>
    <div class="indicator" data-testid="conn-indicator" data-state="connecting">
      <div class="indicator-dot warn" id="conn-dot">
        <svg class="ci-ico ci-link" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="ci-ico ci-broken" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18.84 12.25l1.72-1.71a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.17 11.75l-1.71 1.71a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 2v2M2 8h2M16 20v2M20 16h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <span id="conn-text">connecting</span>
    </div>
  </div>
</header>

<div class="theme-notice" id="theme-notice" data-testid="theme-notice" role="status" hidden>
  <span id="theme-notice-text"></span>
  <button class="theme-notice-close" id="theme-notice-close" data-testid="theme-notice-close" aria-label="Dismiss">&times;</button>
</div>

<div class="drawer" id="autosync-drawer" data-testid="autosync-drawer" role="dialog" aria-label="Autosync">
  <div class="drawer-inner">

    <div class="drawer-sub" id="autosync-sub">All stacks in sync.</div>

    <div class="global-row">
      <div>
        <div class="gr-label">Global autosync</div>
        <div class="gr-note" id="autosync-global-note">on · deploys apply automatically</div>
      </div>
      <div class="sw lg on" id="autosync-global-sw" data-testid="global-switch" role="switch" aria-checked="true" tabindex="0" title="Toggle global autosync"></div>

    <div class="sec-label">Queued <span class="sec-count" id="autosync-qcount"></span> · drains in this order</div>
    <div class="qlist" id="autosync-queue-list"></div>

    <div class="sec-label">All stacks</div>
    <div class="stack-filter-wrap" id="autosync-filter-wrap">
      <svg class="fi" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input class="stack-filter" id="autosync-filter" data-testid="stack-filter" type="text" placeholder="Filter stacks…" autocomplete="off" spellcheck="false" aria-label="Filter stacks">
      <button class="stack-filter-clear" id="autosync-filter-clear" data-testid="stack-filter-clear" type="button" aria-label="Clear filter">&times;</button>

<main>
  <div class="empty-state" id="empty-state" data-testid="empty-state">
    <svg class="empty-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="24"/>
      <circle cx="32" cy="32" r="4"/>
      <line x1="32" y1="12" x2="32" y2="20"/>
      <line x1="32" y1="44" x2="32" y2="52"/>
      <line x1="12" y1="32" x2="20" y2="32"/>
      <line x1="44" y1="32" x2="52" y2="32"/>
    </svg>
    <p>Awaiting deployment events...</p>
  </div>

  <div id="deploy-table" data-testid="deploys-table" style="display:none">
    <div class="event-list-header">
      <span>Time</span>
      <span>Stack</span>
      <span>Status</span>
      <span>Duration</span>
      <span>Files</span>
    </div>
