<style>
  :root {
    --bg-deep: #060a14;
    --bg-base: #0b1120;
    --bg-surface: #111827;
    --bg-raised: #1a2436;
    --border: rgba(148, 163, 184, 0.08);
    --border-lit: rgba(148, 163, 184, 0.15);
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #475569;
    --amber: #f59e0b;
    --amber-dim: rgba(245, 158, 11, 0.12);
    --amber-glow: rgba(245, 158, 11, 0.25);
    --teal: #2dd4bf;
    --teal-dim: rgba(45, 212, 191, 0.10);
    --red: #f87171;
    --red-dim: rgba(248, 113, 113, 0.10);
    --slate: #64748b;
    --slate-dim: rgba(100, 116, 139, 0.10);
    --font-display: 'DM Sans', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
    --radius: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-display);
    background: var(--bg-deep);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid pattern overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(148, 163, 184, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.02) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* Ambient glow at top */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(245, 158, 11, 0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── HEADER ─── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(11, 17, 32, 0.82);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 32px;
    height: 32px;
    position: relative;
  }

  .brand-icon img { width: 32px; height: 32px; object-fit: contain; }

  .brand-name {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }

  .brand-name span {
    color: var(--amber);
  }

  .brand-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-left: 4px;
  }

  .status-area {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    font-family: var(--font-mono);
  }

  .indicator-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 8px rgba(45, 212, 191, 0.4);
    flex-shrink: 0;
  }

  .indicator-dot.warn {
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber-glow);
    animation: breathe 2s ease-in-out infinite;
  }

  .indicator-dot.err {
    background: var(--red);
    box-shadow: 0 0 8px rgba(248, 113, 113, 0.4);
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--amber-glow); }
    50% { opacity: 0.4; box-shadow: 0 0 4px var(--amber-glow); }
  }

  .deploy-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font-mono);
    color: var(--text-muted);
    transition: color 0.3s;
  }

  .deploy-status.active { color: var(--amber); }
  .deploy-status.active .deploy-dot {
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber-glow);
    animation: breathe 2s ease-in-out infinite;
  }

  .deploy-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.3s;
    flex-shrink: 0;
  }

  /* ─── MAIN ─── */
  main {
    position: relative;
    z-index: 1;
    max-width: 1040px;
    margin: 32px auto;
    padding: 0 20px;
  }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 24px;
    color: var(--text-muted);
  }

  .empty-icon {
    width: 64px;
    height: 64px;
    margin-bottom: 20px;
    opacity: 0.3;
  }

  .empty-state p {
    font-size: 14px;
    font-family: var(--font-mono);
    letter-spacing: -0.2px;
  }

  /* ─── EVENT LIST ─── */
  .event-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .event-list-header {
    display: grid;
    grid-template-columns: 160px 1fr 110px 80px 100px;
    gap: 12px;
    padding: 0 20px 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  .event-row {
    display: grid;
    grid-template-columns: 160px 1fr 110px 80px 100px;
    gap: 12px;
    align-items: center;
    padding: 12px 20px;
    border-radius: var(--radius);
    transition: background 0.2s, transform 0.2s;
    position: relative;
  }

  .event-row:hover {
    background: rgba(148, 163, 184, 0.03);
  }

  .event-row.new-row {
    animation: rowEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rowEnter {
    from { opacity: 0; transform: translateY(-12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .event-row.skipped {
    opacity: 0.35;
  }

  .event-row.skipped:hover {
    opacity: 0.55;
  }

  /* Active deploy glow */
  .event-row.deploying-row {
    background: var(--amber-dim);
    border: 1px solid rgba(245, 158, 11, 0.12);
    margin: 2px 0;
  }

  .event-row.deploying-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--amber);
    border-radius: 0 2px 2px 0;
    box-shadow: 0 0 12px var(--amber-glow);
  }

  .event-row.failed-row {
    background: var(--red-dim);
  }

  .event-row.failed-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--red);
    border-radius: 0 2px 2px 0;
  }

  .event-row.success-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--teal);
    border-radius: 0 2px 2px 0;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .event-row.success-row:hover::before {
    opacity: 1;
  }

  /* ─── CELLS ─── */
  .cell-time {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .cell-stack {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cell-duration {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ─── STATUS BADGES ─── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 5px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    white-space: nowrap;
    text-transform: uppercase;
  }

  .badge-success {
    background: var(--teal-dim);
    color: var(--teal);
    border: 1px solid rgba(45, 212, 191, 0.15);
  }

  .badge-failed {
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(248, 113, 113, 0.15);
  }

  .badge-skipped {
    background: var(--slate-dim);
    color: var(--slate);
    border: 1px solid rgba(100, 116, 139, 0.1);
  }

  .badge-deploying {
    background: var(--amber-dim);
    color: var(--amber);
    border: 1px solid rgba(245, 158, 11, 0.15);
  }

  .spinner {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    animation: breathe 1.4s ease-in-out infinite;
  }

  /* ─── FILES PILL ─── */
  .files-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(148, 163, 184, 0.06);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .files-pill:hover {
    background: rgba(148, 163, 184, 0.10);
    border-color: var(--border-lit);
    color: var(--text-primary);
  }

  .files-pill svg {
    width: 12px;
    height: 12px;
    opacity: 0.5;
  }

  .files-list {
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 2;
    word-break: break-all;
    animation: expand 0.2s ease-out;
  }

  @keyframes expand {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .file-path {
    padding: 1px 6px;
    border-radius: 3px;
    background: rgba(148, 163, 184, 0.06);
    display: inline-block;
    margin: 1px 0;
  }

  /* ─── ERROR ─── */
  .error-detail {
    grid-column: 1 / -1;
    margin-top: 4px;
    padding: 10px 14px;
    background: rgba(248, 113, 113, 0.04);
    border: 1px solid rgba(248, 113, 113, 0.12);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--red);
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.6;
    animation: expand 0.2s ease-out;
  }

  /* ─── SEPARATOR ─── */
  .sep {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }

  .sep::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ─── FILTER TOGGLE ─── */
  .filter-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font-mono);
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    background: none;
    border: none;
    padding: 0;
    transition: color 0.2s;
  }

  .filter-toggle:hover { color: var(--text-secondary); }

  .toggle-track {
    width: 28px;
    height: 16px;
    border-radius: 8px;
    background: var(--bg-raised);
    border: 1px solid var(--border-lit);
    position: relative;
    transition: background 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }

  .toggle-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: transform 0.2s, background 0.2s;
  }

  .filter-toggle.active .toggle-track {
    background: var(--amber-dim);
    border-color: rgba(245, 158, 11, 0.3);
  }

  .filter-toggle.active .toggle-thumb {
    transform: translateX(12px);
    background: var(--amber);
  }

  .filter-toggle.active { color: var(--amber); }

  #tbody.hide-skipped .event-row.skipped { display: none; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 700px) {
    header { padding: 0 16px; height: 48px; }
    .brand-tag { display: none; }
    main { margin: 16px auto; padding: 0 12px; }

    .event-list-header { display: none; }

    .event-row {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 4px 12px;
      padding: 10px 14px;
    }

    .cell-time { grid-column: 1; grid-row: 2; font-size: 11px; }
    .cell-stack { grid-column: 1; grid-row: 1; }
    .status-cell { grid-column: 2; grid-row: 1; }
    .cell-duration { grid-column: 2; grid-row: 2; text-align: right; }
    .col-files { display: none; }
  }
</style>
</head>

<main>
  <div class="empty-state" id="empty-state">
    <svg class="empty-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="24"/>
      <circle cx="32" cy="32" r="4"/>
      <line x1="32" y1="12" x2="32" y2="20"/>
      <line x1="32" y1="44" x2="32" y2="52"/>
      <line x1="12" y1="32" x2="20" y2="32"/>
      <line x1="44" y1="32" x2="52" y2="32"/>
    </svg>
    <p>Awaiting deployment events...</p>
  </div>

  <div id="deploy-table" style="display:none">
    <div class="event-list-header">
      <span>Time</span>
      <span>Stack</span>
      <span>Status</span>
      <span>Duration</span>
      <span>Files</span>
    </div>
    <div class="event-list" id="tbody"></div>
  </div>
</main>

<script>
(function() {
  const tbody = document.getElementById('tbody');
  const table = document.getElementById('deploy-table');
  const emptyState = document.getElementById('empty-state');
  const connDot = document.getElementById('conn-dot');
  const connText = document.getElementById('conn-text');
  const deployStatus = document.getElementById('deploy-status');

  const deployingRows = {};
  let hasRows = false;
  let absoluteTime = localStorage.getItem('timeMode') === 'absolute';

  function showTable() {
    if (!hasRows) {
      hasRows = true;
      table.style.display = '';
      emptyState.style.display = 'none';
    }
  }

  function formatDuration(ms) {
    if (!ms || ms <= 0) return '\u2014';
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    const rem = s % 60;
    return m + 'm ' + rem + 's';
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diffS = Math.floor((now - d) / 1000);
    if (diffS < 5) return 'just now';
    if (diffS < 60) return diffS + 's ago';
    if (diffS < 3600) return Math.floor(diffS / 60) + 'm ago';
    if (diffS < 86400) return Math.floor(diffS / 3600) + 'h ago';
    return Math.floor(diffS / 86400) + 'd ago';
  }

  function fullTime(ts) {
    return new Date(ts).toLocaleString();
  }

  function badgeHTML(status) {
    var cls = 'badge badge-' + status;
    if (status === 'deploying') return '<span class="' + cls + '"><span class="spinner"></span>deploying</span>';
    return '<span class="' + cls + '">' + status + '</span>';
  }

  function filesHTML(files) {
    if (!files || files.length === 0) return '<span class="cell-duration">\u2014</span>';
    var encoded = escapeHtml(JSON.stringify(files));
    var html = '<button class="files-pill" data-files="' + encoded + '">';
    html += '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h5l2 2h5v7H2z"/></svg>';
    html += files.length + ' file' + (files.length > 1 ? 's' : '');
    html += '</button>';
    return html;
  }

  function createFilesPanel(files) {
    var el = document.createElement('div');
    el.className = 'files-list';
    el.innerHTML = files.map(function(f) {
      return '<span class="file-path">' + escapeHtml(f) + '</span>';
    }).join('<br>');
    return el;
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function rowClass(status, isHistory) {
    var cls = 'event-row';
    if (status === 'skipped') cls += ' skipped';
    if (status === 'deploying') cls += ' deploying-row';
    if (status === 'failed') cls += ' failed-row';
    if (status === 'success') cls += ' success-row';
    if (!isHistory) cls += ' new-row';
    return cls;
  }

  function createRow(evt, isHistory) {
    var row = document.createElement('div');
    row.className = rowClass(evt.status, isHistory);
    row.dataset.stack = evt.stack;
    row.dataset.eventId = evt.id;

    var absTs = fullTime(evt.timestamp);
    var relTs = formatTime(evt.timestamp);
    row.innerHTML =
      '<span class="cell-time" data-ts="' + evt.timestamp + '" title="' + (absoluteTime ? relTs : absTs) + '">' + (absoluteTime ? absTs : relTs) + '</span>' +
      '<span class="cell-stack">' + escapeHtml(evt.stack) + '</span>' +
      '<span class="status-cell">' + badgeHTML(evt.status) + '</span>' +
      '<span class="cell-duration">' + formatDuration(evt.duration_ms) + '</span>' +
      '<span class="col-files">' + filesHTML(evt.changed_files) + '</span>';

    return row;
  }

  function createErrorDetail(evt) {
    var el = document.createElement('div');
    el.className = 'error-detail';
    el.dataset.errorFor = evt.stack;
    el.textContent = evt.error;
    return el;
  }

  function updateDeployingIndicator() {
    var active = Object.keys(deployingRows);
    if (active.length > 0) {
      deployStatus.className = 'deploy-status active';
      deployStatus.querySelector('span').textContent = active.join(', ');
    } else {
      deployStatus.className = 'deploy-status';
      deployStatus.querySelector('span').textContent = 'idle';
    }
  }

  function handleEvent(evt, isHistory) {
    showTable();

    if (evt.status === 'deploying') {
      var row = createRow(evt, isHistory);
      tbody.insertBefore(row, tbody.firstChild);
      deployingRows[evt.stack] = row;
      updateDeployingIndicator();
      return;
    }

    if ((evt.status === 'success' || evt.status === 'failed') && deployingRows[evt.stack]) {
      var existing = deployingRows[evt.stack];
      existing.className = rowClass(evt.status, isHistory);
      existing.querySelector('.status-cell').innerHTML = badgeHTML(evt.status);
      existing.querySelector('.cell-duration').textContent = formatDuration(evt.duration_ms);
      var tc = existing.querySelector('.cell-time');
      tc.dataset.ts = evt.timestamp;
      tc.textContent = absoluteTime ? fullTime(evt.timestamp) : formatTime(evt.timestamp);
      tc.title = absoluteTime ? formatTime(evt.timestamp) : fullTime(evt.timestamp);
      if (evt.error) {
        existing.after(createErrorDetail(evt));
      }
      delete deployingRows[evt.stack];
      updateDeployingIndicator();
      return;
    }

    var row = createRow(evt, isHistory);
    tbody.insertBefore(row, tbody.firstChild);
    if (evt.error) {
      row.after(createErrorDetail(evt));
    }
  }

  setInterval(function() {
    if (!absoluteTime) {
      tbody.querySelectorAll('.cell-time').forEach(function(cell) {
        var abs = cell.dataset.ts;
        if (abs) cell.textContent = formatTime(abs);
      });
    }
  }, 30000);

  function connect() {
    connDot.className = 'indicator-dot warn';
    connText.textContent = 'connecting';

    var es = new EventSource('/api/events');

    es.onopen = function() {
      connDot.className = 'indicator-dot';
      connText.textContent = 'connected';
    };

    es.addEventListener('deploy', function(e) {
      var evt = JSON.parse(e.data);
      handleEvent(evt, false);
    });

    es.onerror = function() {
      connDot.className = 'indicator-dot err';
      connText.textContent = 'reconnecting';
    };
  }

  // Time mode toggle (default: relative)
  const timeModeBtn = document.getElementById('time-mode');

  function applyTimeMode() {
    if (absoluteTime) {
      timeModeBtn.classList.add('active');
      timeModeBtn.title = 'Switch to relative time';
    } else {
      timeModeBtn.classList.remove('active');
      timeModeBtn.title = 'Switch to absolute time';
    }
    tbody.querySelectorAll('.cell-time').forEach(function(cell) {
      var ts = cell.dataset.ts;
      if (!ts) return;
      cell.textContent = absoluteTime ? fullTime(ts) : formatTime(ts);
      cell.title = absoluteTime ? formatTime(ts) : fullTime(ts);
    });
  }

  timeModeBtn.addEventListener('click', function() {
    absoluteTime = !absoluteTime;
    localStorage.setItem('timeMode', absoluteTime ? 'absolute' : 'relative');
    applyTimeMode();
  });

  applyTimeMode();

  // Skipped-filter toggle (default: hidden)
  const skipFilter = document.getElementById('skip-filter');
  let hideSkipped = localStorage.getItem('hideSkipped') !== 'false';

  function applySkipFilter() {
    if (hideSkipped) {
      tbody.classList.add('hide-skipped');
      skipFilter.classList.add('active');
    } else {
      tbody.classList.remove('hide-skipped');
      skipFilter.classList.remove('active');
    }
  }

  skipFilter.addEventListener('click', function() {
    hideSkipped = !hideSkipped;
    localStorage.setItem('hideSkipped', String(hideSkipped));
    applySkipFilter();
  });

  applySkipFilter();

  // Files panel — open/close as full-width sibling below the row
  tbody.addEventListener('click', function(e) {
    var pill = e.target.closest('.files-pill');
    if (!pill) return;
    var row = pill.closest('.event-row');
    if (!row) return;
    var existing = row.nextElementSibling;
    if (existing && existing.classList.contains('files-list')) {
      existing.remove();
      return;
    }
    var files = JSON.parse(pill.dataset.files);
    row.after(createFilesPanel(files));
  });

  connect();
})();
</script>
</body>
</html>
