<style>
  /* Catppuccin Mocha — the dark default. */
  :root {
    --crust: #11111b;
    --mantle: #181825;
    --base: #1e1e2e;
    --surface0: #313244;
    --overlay1: #7f849c;
    --overlay2: #9399b2;
    --subtext0: #a6adc8;
    --text: #cdd6f4;
    --peach: #fab387;
    --teal: #94e2d5;
    --red: #f38ba8;
    --maroon: #eba0ac;
    --green: #a6e3a1;
    --yellow: #f9e2af;
    color-scheme: dark;
  }

  /* Catppuccin Latte — light theme, opt-in via the header toggle. */
  :root.latte {
    --crust: #dce0e8;
    --mantle: #e6e9ef;
    --base: #eff1f5;
    --surface0: #ccd0da;
    --overlay1: #8c8fa1;
    --overlay2: #7c7f93;
    --subtext0: #6c6f85;
    --text: #4c4f69;
    --peach: #fe640b;
    --teal: #179299;
    --red: #d20f39;
    --maroon: #e64553;
    --green: #40a02b;
    --yellow: #df8e1d;
    color-scheme: light;
  }

  /* Semantic layer — everything below consumes only these tokens, so
     swapping the palette above restyles the whole page. */
  :root {
    --bg-deep: var(--mantle);      /* page */
    --bg-base: var(--base);        /* header glass, cards */
    --bg-sunken: var(--crust);     /* log pane, diff/files panels */
    --bg-raised: var(--surface0);  /* tags, toggle tracks */
    --border: color-mix(in srgb, var(--overlay2) 14%, transparent);
    --border-lit: color-mix(in srgb, var(--overlay2) 28%, transparent);
    --text-primary: var(--text);
    --text-secondary: var(--subtext0);
    --text-muted: var(--overlay1);
    --accent: var(--peach);        /* brand, active deploy */
    --success: var(--teal);
    --danger: var(--red);
    --rollback: var(--maroon);
    --skip: var(--overlay1);
    --diff-add: var(--green);
    --hunk: var(--yellow);
    --accent-dim: color-mix(in srgb, var(--accent) 12%, transparent);
    --accent-glow: color-mix(in srgb, var(--accent) 30%, transparent);
    --success-dim: color-mix(in srgb, var(--success) 12%, transparent);
    --danger-dim: color-mix(in srgb, var(--danger) 10%, transparent);
    --skip-dim: color-mix(in srgb, var(--skip) 12%, transparent);
    --rollback-dim: color-mix(in srgb, var(--rollback) 12%, transparent);
    --font-display: 'DM Sans', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
    --radius: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-display);
    background: var(--bg-deep);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid pattern overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(color-mix(in srgb, var(--overlay2) 7%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--overlay2) 7%, transparent) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* Ambient glow at top */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 400px;
    background: radial-gradient(ellipse, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── HEADER ─── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: color-mix(in srgb, var(--bg-base) 82%, transparent);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 32px;
    height: 32px;
    position: relative;
    color: var(--text-primary);
  }

  .brand-icon svg { display: block; width: 32px; height: 32px; }

  .brand-name {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }

  .brand-name span {
    color: var(--accent);
  }

  .brand-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-left: 4px;
  }

  .status-area {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    font-family: var(--font-mono);
  }

  .indicator-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px color-mix(in srgb, var(--success) 40%, transparent);
    flex-shrink: 0;
  }

  .indicator-dot.warn {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    animation: breathe 2s ease-in-out infinite;
  }

  .indicator-dot.err {
    background: var(--danger);
    box-shadow: 0 0 8px color-mix(in srgb, var(--danger) 40%, transparent);
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent-glow); }
    50% { opacity: 0.4; box-shadow: 0 0 4px var(--accent-glow); }
  }

  .deploy-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font-mono);
    color: var(--text-muted);
    transition: color 0.3s;
  }

  .deploy-status.active { color: var(--accent); }
  .deploy-status.active .deploy-dot {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    animation: breathe 2s ease-in-out infinite;
  }

  .deploy-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.3s;
    flex-shrink: 0;
  }

  /* ─── MAIN ─── */
  main {
    position: relative;
    z-index: 1;
    max-width: 1040px;
    margin: 32px auto;
    padding: 0 20px;
  }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 24px;
    color: var(--text-muted);
  }

  .empty-icon {
    width: 64px;
    height: 64px;
    margin-bottom: 20px;
    opacity: 0.3;
  }

  .empty-state p {
    font-size: 14px;
    font-family: var(--font-mono);
    letter-spacing: -0.2px;
  }

  /* ─── EVENT LIST ─── */
  .event-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .event-list-header {
    display: grid;
    grid-template-columns: 160px 1fr 110px 80px 100px;
    gap: 12px;
    padding: 0 20px 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  .event-row {
    display: grid;
    grid-template-columns: 160px 1fr 110px 80px 100px;
    gap: 12px;
    align-items: center;
    padding: 12px 20px;
    border-radius: var(--radius);
    transition: background 0.2s, transform 0.2s;
    position: relative;
  }

  .event-row:hover {
    background: color-mix(in srgb, var(--overlay2) 6%, transparent);
  }

  .event-row.new-row {
    animation: rowEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rowEnter {
    from { opacity: 0; transform: translateY(-12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .event-row.skipped {
    opacity: 0.35;
  }

  .event-row.skipped:hover {
    opacity: 0.55;
  }

  /* Active deploy glow */
  .event-row.deploying-row {
    background: var(--accent-dim);
    border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
    margin: 2px 0;
  }

  .event-row.deploying-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .event-row.failed-row {
    background: var(--danger-dim);
  }

  .event-row.failed-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--danger);
    border-radius: 0 2px 2px 0;
  }

  .event-row.rolled_back-row {
    background: var(--rollback-dim);
  }

  .event-row.rolled_back-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--rollback);
    border-radius: 0 2px 2px 0;
  }

  .event-row.success-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--success);
    border-radius: 0 2px 2px 0;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .event-row.success-row:hover::before {
    opacity: 1;
  }

  /* ─── CELLS ─── */
  .cell-time {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .cell-stack {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cell-duration {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ─── STATUS BADGES ─── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 5px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    white-space: nowrap;
    text-transform: uppercase;
  }

  .badge-success {
    background: var(--success-dim);
    color: var(--success);
    border: 1px solid color-mix(in srgb, var(--success) 20%, transparent);
  }

  .badge-failed {
    background: var(--danger-dim);
    color: var(--danger);
    border: 1px solid color-mix(in srgb, var(--danger) 20%, transparent);
  }

  .badge-skipped {
    background: var(--skip-dim);
    color: var(--skip);
    border: 1px solid color-mix(in srgb, var(--skip) 15%, transparent);
  }

  .badge-deploying {
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
  }

  .badge-rolled_back {
    background: var(--rollback-dim);
    color: var(--rollback);
    border: 1px solid color-mix(in srgb, var(--rollback) 22%, transparent);
  }

  .spinner {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    animation: breathe 1.4s ease-in-out infinite;
  }

  /* ─── FILES PILL ─── */
  .files-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--overlay2) 9%, transparent);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .files-pill:hover {
    background: color-mix(in srgb, var(--overlay2) 14%, transparent);
    border-color: var(--border-lit);
    color: var(--text-primary);
  }

  .files-pill svg {
    width: 12px;
    height: 12px;
    opacity: 0.5;
  }

  .files-list {
    padding: 10px 14px;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 2;
    word-break: break-all;
    animation: expand 0.2s ease-out;
  }

  @keyframes expand {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .file-path {
    padding: 1px 6px;
    border-radius: 3px;
    background: color-mix(in srgb, var(--overlay2) 9%, transparent);
    display: inline-block;
    margin: 1px 0;
  }

  /* ─── ERROR ─── */
  .error-detail {
    grid-column: 1 / -1;
    margin-top: 4px;
    padding: 10px 14px;
    background: color-mix(in srgb, var(--danger) 6%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 16%, transparent);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--danger);
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.6;
    animation: expand 0.2s ease-out;
  }

  /* ─── DIFF PANEL ─── */
  .diff-panel {
    padding: 0;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    overflow: hidden;
    animation: expand 0.2s ease-out;
  }

  .diff-file-section {
    border-bottom: 1px solid var(--border);
  }

  .diff-file-section:last-child {
    border-bottom: none;
  }

  .diff-file-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: color-mix(in srgb, var(--overlay2) 6%, transparent);
    cursor: pointer;
    user-select: none;
    font-weight: 500;
    color: var(--text-primary);
    font-size: 11px;
    transition: background 0.15s;
  }

  .diff-file-header:hover {
    background: color-mix(in srgb, var(--overlay2) 10%, transparent);
  }

  .diff-file-header svg {
    width: 10px;
    height: 10px;
    opacity: 0.5;
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .diff-file-header.expanded svg {
    transform: rotate(90deg);
  }

  .diff-content {
    display: none;
    padding: 0;
    overflow-x: auto;
    white-space: pre;
    line-height: 1.6;
  }

  .diff-file-header.expanded + .diff-content {
    display: block;
  }

  .diff-line {
    padding: 0 14px;
    display: block;
  }

  .diff-add {
    background: color-mix(in srgb, var(--diff-add) 12%, transparent);
    color: var(--diff-add);
  }

  .diff-del {
    background: color-mix(in srgb, var(--danger) 12%, transparent);
    color: var(--danger);
  }

  .diff-hunk {
    background: color-mix(in srgb, var(--hunk) 10%, transparent);
    color: var(--hunk);
    font-weight: 500;
  }

  .diff-meta {
    color: var(--text-muted);
  }

  .diff-loading {
    padding: 12px 14px;
    color: var(--text-muted);
    font-style: italic;
  }

  /* ─── SEPARATOR ─── */
  .sep {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }

  .sep::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ─── FILTER TOGGLE ─── */
  .filter-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font-mono);
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    background: none;
    border: none;
    padding: 0;
    transition: color 0.2s;
  }

  .filter-toggle:hover { color: var(--text-secondary); }

  .toggle-track {
    width: 28px;
    height: 16px;
    border-radius: 8px;
    background: var(--bg-raised);
    border: 1px solid var(--border-lit);
    position: relative;
    transition: background 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }

  .toggle-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: transform 0.2s, background 0.2s;
  }

  .filter-toggle.active .toggle-track {
    background: var(--accent-dim);
    border-color: color-mix(in srgb, var(--accent) 35%, transparent);
  }

  .filter-toggle.active .toggle-thumb {
    transform: translateX(12px);
    background: var(--accent);
  }

  .filter-toggle.active { color: var(--accent); }

  #tbody.hide-skipped .event-row.skipped { display: none; }

  /* ─── VIEW TOGGLE ─── */
  .view-toggle {
    display: flex;
    gap: 2px;
    padding: 2px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .view-toggle button {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.3px;
    color: var(--text-muted);
    background: none;
    border: none;
    border-radius: 4px;
    padding: 3px 10px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }

  .view-toggle button:hover:not(.active) { color: var(--text-secondary); }

  .view-toggle button.active {
    color: var(--accent);
    background: var(--accent-dim);
  }

  /* ─── LOG VIEW ─── */
  /* body.view-logs switches between the deploy table and the log pane;
     !important wins over the inline display set by showTable(). */
  #log-view { display: none; }
  body.view-logs #log-view { display: block; }
  body.view-logs #deploy-table, body.view-logs #empty-state { display: none !important; }
  body.view-logs #skip-filter, body.view-logs #time-mode { display: none; }
  #follow-logs { display: none; }
  body.view-logs #follow-logs { display: flex; }

  .log-pane {
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.7;
    padding: 10px 0;
    height: calc(100vh - 150px);
    overflow-y: auto;
  }

  .log-empty {
    padding: 90px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  .log-line {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 0 14px;
  }

  .log-line:hover { background: color-mix(in srgb, var(--overlay2) 6%, transparent); }

  .log-time {
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .log-level {
    flex-shrink: 0;
    width: 44px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
  }

  .log-level.ERROR { color: var(--danger); }
  .log-level.WARN { color: var(--yellow); }
  .log-level.DEBUG { color: var(--skip); }

  .log-cmd {
    color: var(--skip);
    flex-shrink: 0;
  }

  .log-stack {
    color: var(--accent);
    flex-shrink: 0;
  }

  .log-msg {
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-all;
  }

  .log-attrs {
    color: var(--text-muted);
    word-break: break-all;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 700px) {
    header { padding: 0 16px; height: 48px; }
    .brand-tag { display: none; }
    /* Bare switches — the labels don't fit next to the view toggle. */
    .filter-toggle span { display: none; }
    main { margin: 16px auto; padding: 0 12px; }

    .event-list-header { display: none; }

    .event-row {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 4px 12px;
      padding: 10px 14px;
    }

    .cell-time { grid-column: 1; grid-row: 2; font-size: 11px; }
    .cell-stack { grid-column: 1; grid-row: 1; }
    .status-cell { grid-column: 2; grid-row: 1; }
    .cell-duration { grid-column: 2; grid-row: 2; text-align: right; }
    .col-files { display: none; }
    .event-row:has(.files-pill) { cursor: pointer; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 64 64" fill="none" role="img" aria-label="skipper-cd">
        <path d="M9 41 H55 L45 53 H19 Z" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
        <rect x="19" y="30" width="12" height="9" rx="2" fill="var(--accent)"/>
        <rect x="33" y="30" width="12" height="9" rx="2" stroke="currentColor" stroke-width="3"/>
        <rect x="26" y="18" width="12" height="9" rx="2" fill="var(--success)"/>
        <path d="M14 60 q5 -5 10 0 t10 0 t10 0 t10 0" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"/>
      </svg>
    </div>
    <span class="brand-name">skipper<span>-cd</span></span>
    <span class="brand-tag">live</span>
  </div>
  <div class="status-area">
    <div class="view-toggle" id="view-toggle">
      <button data-view="deploys" class="active">deploys</button>
      <button data-view="logs">logs</button>
    </div>
    <div class="deploy-status" id="deploy-status">
      <div class="deploy-dot"></div>
      <span>idle</span>
    </div>
    <button class="filter-toggle active" id="skip-filter" title="Show/hide skipped deployments">
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
      <span>hide skipped</span>
    </button>
    <button class="filter-toggle" id="time-mode" title="Switch to absolute time">
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
      <span>abs time</span>
    </button>
    <button class="filter-toggle" id="follow-logs" title="Auto-scroll to newest log lines">
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
      <span>follow</span>
    </button>
    <button class="filter-toggle" id="theme-toggle" title="Switch to light theme">
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
      <span>light</span>
    </button>
    <div class="indicator">
      <div class="indicator-dot warn" id="conn-dot"></div>
      <span id="conn-text">connecting</span>
    </div>
  </div>
</header>

<main>
  <div class="empty-state" id="empty-state">
    <svg class="empty-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="24"/>
      <circle cx="32" cy="32" r="4"/>
      <line x1="32" y1="12" x2="32" y2="20"/>
      <line x1="32" y1="44" x2="32" y2="52"/>
      <line x1="12" y1="32" x2="20" y2="32"/>
      <line x1="44" y1="32" x2="52" y2="32"/>
    </svg>
    <p>Awaiting deployment events...</p>
  </div>

  <div id="deploy-table" style="display:none">
    <div class="event-list-header">
      <span>Time</span>
      <span>Stack</span>
      <span>Status</span>
      <span>Duration</span>
      <span>Files</span>
    </div>
    <div class="event-list" id="tbody"></div>
  </div>

  <div id="log-view">
    <div class="log-pane" id="log-pane">
      <div class="log-empty" id="log-empty">Awaiting log output...</div>
    </div>
  </div>
</main>

<script>
(function() {
  const tbody = document.getElementById('tbody');
  const table = document.getElementById('deploy-table');
  const emptyState = document.getElementById('empty-state');
  const connDot = document.getElementById('conn-dot');
  const connText = document.getElementById('conn-text');
  const deployStatus = document.getElementById('deploy-status');

  const deployingRows = {};
  let hasRows = false;
  let absoluteTime = localStorage.getItem('timeMode') === 'absolute';

  function showTable() {
    if (!hasRows) {
      hasRows = true;
      table.style.display = '';
      emptyState.style.display = 'none';
    }
  }

  function formatDuration(ms) {
    if (!ms || ms <= 0) return '\u2014';
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    const rem = s % 60;
    return m + 'm ' + rem + 's';
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diffS = Math.floor((now - d) / 1000);
    if (diffS < 5) return 'just now';
    if (diffS < 60) return diffS + 's ago';
    if (diffS < 3600) return Math.floor(diffS / 60) + 'm ago';
    if (diffS < 86400) return Math.floor(diffS / 3600) + 'h ago';
    return Math.floor(diffS / 86400) + 'd ago';
  }

  function fullTime(ts) {
    return new Date(ts).toLocaleString();
  }

  function badgeHTML(status) {
    var cls = 'badge badge-' + status;
    if (status === 'deploying') return '<span class="' + cls + '"><span class="spinner"></span>deploying</span>';
    var label = status === 'rolled_back' ? 'rolled back' : status;
    return '<span class="' + cls + '">' + label + '</span>';
  }

  function filesHTML(files) {
    if (!files || files.length === 0) return '<span class="cell-duration">\u2014</span>';
    // escapeAttr also encodes quotes - JSON is full of them and this lands
    // inside a double-quoted attribute.
    var encoded = escapeAttr(JSON.stringify(files));
    var html = '<button class="files-pill" data-files="' + encoded + '">';
    html += '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h5l2 2h5v7H2z"/></svg>';
    html += files.length + ' file' + (files.length > 1 ? 's' : '');
    html += '</button>';
    return html;
  }

  function createFilesPanel(files) {
    var el = document.createElement('div');
    el.className = 'files-list';
    el.innerHTML = files.map(function(f) {
      return '<span class="file-path">' + escapeHtml(f) + '</span>';
    }).join('<br>');
    return el;
  }

  function classifyDiffLine(line) {
    if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('diff ') || line.startsWith('index ')) return 'diff-meta';
    if (line.startsWith('@@')) return 'diff-hunk';
    if (line.startsWith('+')) return 'diff-add';
    if (line.startsWith('-')) return 'diff-del';
    return '';
  }

  function renderDiffContent(diff) {
    return diff.split('\n').map(function(line) {
      var cls = classifyDiffLine(line);
      return '<span class="diff-line' + (cls ? ' ' + cls : '') + '">' + escapeHtml(line) + '</span>';
    }).join('\n');
  }

  function renderDiffPanel(diffs) {
    var el = document.createElement('div');
    el.className = 'diff-panel';
    var files = Object.keys(diffs);
    var singleFile = files.length === 1;
    el.innerHTML = files.map(function(f) {
      var name = f.split('/').pop() || f;
      return '<div class="diff-file-section">' +
        '<div class="diff-file-header' + (singleFile ? ' expanded' : '') + '">' +
        '<svg viewBox="0 0 10 10"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>' +
        '<span>' + escapeHtml(name) + '</span></div>' +
        '<div class="diff-content">' + renderDiffContent(diffs[f]) + '</div>' +
        '</div>';
    }).join('');
    return el;
  }

  var diffCache = {};

  function fetchDiffs(eventId, callback) {
    if (diffCache[eventId]) {
      callback(diffCache[eventId]);
      return;
    }
    fetch('/api/events/' + eventId + '/diffs')
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        if (data && data.diffs) {
          diffCache[eventId] = data.diffs;
          callback(data.diffs);
        } else {
          callback(null);
        }
      })
      .catch(function() { callback(null); });
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // escapeAttr escapes for use inside a double-quoted HTML attribute:
  // like escapeHtml, but quotes must be encoded too.
  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, '&quot;');
  }

  function rowClass(status, isHistory) {
    var cls = 'event-row';
    if (status === 'skipped') cls += ' skipped';
    if (status === 'deploying') cls += ' deploying-row';
    if (status === 'failed') cls += ' failed-row';
    if (status === 'success') cls += ' success-row';
    if (status === 'rolled_back') cls += ' rolled_back-row';
    if (!isHistory) cls += ' new-row';
    return cls;
  }

  function createRow(evt, isHistory) {
    var row = document.createElement('div');
    row.className = rowClass(evt.status, isHistory);
    row.dataset.stack = evt.stack;
    row.dataset.eventId = evt.id;
    if (evt.has_diffs) row.dataset.hasDiffs = '1';

    var absTs = fullTime(evt.timestamp);
    var relTs = formatTime(evt.timestamp);
    row.innerHTML =
      '<span class="cell-time" data-ts="' + evt.timestamp + '" title="' + (absoluteTime ? relTs : absTs) + '">' + (absoluteTime ? absTs : relTs) + '</span>' +
      '<span class="cell-stack">' + escapeHtml(evt.stack) + '</span>' +
      '<span class="status-cell">' + badgeHTML(evt.status) + '</span>' +
      '<span class="cell-duration">' + formatDuration(evt.duration_ms) + '</span>' +
      '<span class="col-files">' + filesHTML(evt.changed_files) + '</span>';

    return row;
  }

  function createErrorDetail(evt) {
    var el = document.createElement('div');
    el.className = 'error-detail';
    el.dataset.errorFor = evt.stack;
    el.textContent = evt.error;
    return el;
  }

  function updateDeployingIndicator() {
    var active = Object.keys(deployingRows);
    if (active.length > 0) {
      deployStatus.className = 'deploy-status active';
      deployStatus.querySelector('span').textContent = active.join(', ');
    } else {
      deployStatus.className = 'deploy-status';
      deployStatus.querySelector('span').textContent = 'idle';
    }
  }

  function handleEvent(evt, isHistory) {
    showTable();

    if (evt.status === 'deploying') {
      var row = createRow(evt, isHistory);
      tbody.insertBefore(row, tbody.firstChild);
      deployingRows[evt.stack] = row;
      updateDeployingIndicator();
      return;
    }

    if ((evt.status === 'success' || evt.status === 'failed' || evt.status === 'rolled_back') && deployingRows[evt.stack]) {
      var existing = deployingRows[evt.stack];
      existing.className = rowClass(evt.status, isHistory);
      existing.dataset.eventId = evt.id;
      if (evt.has_diffs) existing.dataset.hasDiffs = '1';
      existing.querySelector('.status-cell').innerHTML = badgeHTML(evt.status);
      existing.querySelector('.cell-duration').textContent = formatDuration(evt.duration_ms);
      var tc = existing.querySelector('.cell-time');
      tc.dataset.ts = evt.timestamp;
      tc.textContent = absoluteTime ? fullTime(evt.timestamp) : formatTime(evt.timestamp);
      tc.title = absoluteTime ? formatTime(evt.timestamp) : fullTime(evt.timestamp);
      if (evt.changed_files && evt.changed_files.length > 0) {
        existing.querySelector('.col-files').innerHTML = filesHTML(evt.changed_files);
      }
      if (evt.error) {
        existing.after(createErrorDetail(evt));
      }
      delete deployingRows[evt.stack];
      updateDeployingIndicator();
      return;
    }

    var row = createRow(evt, isHistory);
    tbody.insertBefore(row, tbody.firstChild);
    if (evt.error) {
      row.after(createErrorDetail(evt));
    }
  }

  setInterval(function() {
    if (!absoluteTime) {
      tbody.querySelectorAll('.cell-time').forEach(function(cell) {
        var abs = cell.dataset.ts;
        if (abs) cell.textContent = formatTime(abs);
      });
    }
  }, 30000);

  function connect() {
    connDot.className = 'indicator-dot warn';
    connText.textContent = 'connecting';

    var es = new EventSource('/api/events');

    es.onopen = function() {
      connDot.className = 'indicator-dot';
      connText.textContent = 'connected';
    };

    es.addEventListener('deploy', function(e) {
      var evt = JSON.parse(e.data);
      handleEvent(evt, false);
    });

    es.onerror = function() {
      connDot.className = 'indicator-dot err';
      connText.textContent = 'reconnecting';
    };
  }

  // Time mode toggle (default: relative)
  const timeModeBtn = document.getElementById('time-mode');

  function applyTimeMode() {
    if (absoluteTime) {
      timeModeBtn.classList.add('active');
      timeModeBtn.title = 'Switch to relative time';
    } else {
      timeModeBtn.classList.remove('active');
      timeModeBtn.title = 'Switch to absolute time';
    }
    tbody.querySelectorAll('.cell-time').forEach(function(cell) {
      var ts = cell.dataset.ts;
      if (!ts) return;
      cell.textContent = absoluteTime ? fullTime(ts) : formatTime(ts);
      cell.title = absoluteTime ? formatTime(ts) : fullTime(ts);
    });
  }

  timeModeBtn.addEventListener('click', function() {
    absoluteTime = !absoluteTime;
    localStorage.setItem('timeMode', absoluteTime ? 'absolute' : 'relative');
    applyTimeMode();
  });

  applyTimeMode();

  // Skipped-filter toggle (default: hidden)
  const skipFilter = document.getElementById('skip-filter');
  let hideSkipped = localStorage.getItem('hideSkipped') !== 'false';

  function applySkipFilter() {
    if (hideSkipped) {
      tbody.classList.add('hide-skipped');
      skipFilter.classList.add('active');
    } else {
      tbody.classList.remove('hide-skipped');
      skipFilter.classList.remove('active');
    }
  }

  skipFilter.addEventListener('click', function() {
    hideSkipped = !hideSkipped;
    localStorage.setItem('hideSkipped', String(hideSkipped));
    applySkipFilter();
  });

  applySkipFilter();

  // Theme toggle (default: Catppuccin Mocha; Latte is the opt-in light theme)
  const themeToggle = document.getElementById('theme-toggle');
  let lightTheme = localStorage.getItem('theme') === 'latte';

  function applyTheme() {
    document.documentElement.classList.toggle('latte', lightTheme);
    themeToggle.classList.toggle('active', lightTheme);
    themeToggle.title = lightTheme ? 'Switch to dark theme' : 'Switch to light theme';
  }

  themeToggle.addEventListener('click', function() {
    lightTheme = !lightTheme;
    localStorage.setItem('theme', lightTheme ? 'latte' : 'mocha');
    applyTheme();
  });

  applyTheme();

  // ── Logs view ──
  // The log stream connects lazily on first activation and stays open;
  // the connection indicator remains bound to /api/events.
  const logPane = document.getElementById('log-pane');
  const followBtn = document.getElementById('follow-logs');
  const viewButtons = document.querySelectorAll('#view-toggle button');

  const maxLogLines = 1000;
  let followLogs = localStorage.getItem('followLogs') !== 'false';
  let activeView = localStorage.getItem('activeView') === 'logs' ? 'logs' : 'deploys';
  let logSource = null;

  function levelClass(level) {
    return ['DEBUG', 'INFO', 'WARN', 'ERROR'].indexOf(level) >= 0 ? level : 'INFO';
  }

  // logTime shows the time of day; lines from another day get a date
  // prefix. The full timestamp is always in the tooltip.
  function logTime(ts) {
    var d = new Date(ts);
    var t = d.toLocaleTimeString();
    if (d.toDateString() !== new Date().toDateString()) {
      return d.toLocaleDateString() + ' ' + t;
    }
    return t;
  }

  function renderLogLine(entry) {
    var line = document.createElement('div');
    line.className = 'log-line';
    var attrs = entry.attrs || {};
    var html = '<span class="log-time" title="' + escapeAttr(new Date(entry.time).toLocaleString()) + '">' + escapeHtml(logTime(entry.time)) + '</span>';
    if (attrs.cmd && attrs.stream) {
      // Child process output: slate [cmd] prefix instead of a level badge.
      html += '<span class="log-cmd">[' + escapeHtml(attrs.cmd) + ']</span>';
      html += '<span class="log-msg">' + escapeHtml(entry.msg) + '</span>';
    } else {
      html += '<span class="log-level ' + levelClass(entry.level) + '">' + escapeHtml(entry.level) + '</span>';
      // The stack attr says which stack a deploy line belongs to — render
      // it as a prominent prefix instead of burying it in the attrs blob.
      if (attrs.stack) {
        html += '<span class="log-stack">[' + escapeHtml(attrs.stack) + ']</span>';
      }
      html += '<span class="log-msg">' + escapeHtml(entry.msg) + '</span>';
      var pairs = Object.keys(attrs).filter(function(k) {
        return k !== 'stack';
      }).map(function(k) {
        return escapeHtml(k) + '=' + escapeHtml(attrs[k]);
      });
      if (pairs.length > 0) html += '<span class="log-attrs">' + pairs.join(' ') + '</span>';
    }
    line.innerHTML = html;
    return line;
  }

  function appendLog(entry) {
    var empty = document.getElementById('log-empty');
    if (empty) empty.remove();
    logPane.appendChild(renderLogLine(entry));
    while (logPane.children.length > maxLogLines) {
      logPane.removeChild(logPane.firstChild);
    }
    if (followLogs) logPane.scrollTop = logPane.scrollHeight;
  }

  function connectLogs() {
    if (logSource) return;
    logSource = new EventSource('/api/logs');
    logSource.addEventListener('log', function(e) {
      appendLog(JSON.parse(e.data));
    });
  }

  function applyView() {
    document.body.classList.toggle('view-logs', activeView === 'logs');
    viewButtons.forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.view === activeView);
    });
    if (activeView === 'logs') {
      connectLogs();
      if (followLogs) logPane.scrollTop = logPane.scrollHeight;
    }
  }

  viewButtons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      activeView = btn.dataset.view;
      localStorage.setItem('activeView', activeView);
      applyView();
    });
  });

  function applyFollow() {
    followBtn.classList.toggle('active', followLogs);
    if (followLogs) logPane.scrollTop = logPane.scrollHeight;
  }

  followBtn.addEventListener('click', function() {
    followLogs = !followLogs;
    localStorage.setItem('followLogs', String(followLogs));
    applyFollow();
  });

  applyFollow();
  applyView();

  // Files panel — open/close as full-width sibling below the row.
  // When diffs are available, shows a diff panel; otherwise shows file list.
  tbody.addEventListener('click', function(e) {
    // Handle diff file section collapse/expand
    var fileHeader = e.target.closest('.diff-file-header');
    if (fileHeader) {
      fileHeader.classList.toggle('expanded');
      return;
    }

    var pill = e.target.closest('.files-pill');
    var row = pill ? pill.closest('.event-row') : e.target.closest('.event-row');
    if (!row) return;
    var pillEl = pill || row.querySelector('.files-pill');
    if (!pillEl) return;
    var existing = row.nextElementSibling;
    if (existing && (existing.classList.contains('files-list') || existing.classList.contains('diff-panel'))) {
      existing.remove();
      return;
    }

    var eventId = row.dataset.eventId;
    var hasDiffs = row.dataset.hasDiffs === '1';

    if (hasDiffs && eventId) {
      var loading = document.createElement('div');
      loading.className = 'diff-panel';
      loading.innerHTML = '<div class="diff-loading">Loading diffs...</div>';
      row.after(loading);
      fetchDiffs(eventId, function(diffs) {
        if (loading.parentNode) loading.remove();
        if (diffs && Object.keys(diffs).length > 0) {
          row.after(renderDiffPanel(diffs));
        } else {
          var files = JSON.parse(pillEl.dataset.files);
          row.after(createFilesPanel(files));
        }
      });
    } else {
      var files = JSON.parse(pillEl.dataset.files);
      row.after(createFilesPanel(files));
    }
  });

  connect();
})();
</script>
</body>
</html>
