  </div>

  <div id="log-view">
    <div class="log-pane" id="log-pane">
      <div class="log-empty" id="log-empty">Awaiting log output...</div>
    </div>
  </div>
</main>

<script>
(function() {
  const tbody = document.getElementById('tbody');
  const table = document.getElementById('deploy-table');
  const emptyState = document.getElementById('empty-state');
  const connDot = document.getElementById('conn-dot');
  const connText = document.getElementById('conn-text');
  const deployStatus = document.getElementById('deploy-status');

  const deployingRows = {};
  // Queued (paused) rows, keyed by stack, so a stack's pending row is replaced
  // rather than duplicated, and removed once it deploys or drains.
  const queuedRows = {};
  let hasRows = false;
  let absoluteTime = localStorage.getItem('timeMode') === 'absolute';

  // Autosync state, populated from the 'autosync' and 'queue' SSE events.
  let autosyncSnap = null;                    // GET /api/autosync shape
  let queueSnap = { count: 0, pending: [] };  // GET /api/queue shape
  let queueByStack = {};                       // stack name -> pending item

  function showTable() {
    if (!hasRows) {
      hasRows = true;
      table.style.display = '';
      emptyState.style.display = 'none';
    }
  }

  function formatDuration(ms) {
    if (!ms || ms <= 0) return '\u2014';
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    const rem = s % 60;
    return m + 'm ' + rem + 's';
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diffS = Math.floor((now - d) / 1000);
    if (diffS < 5) return 'just now';
    if (diffS < 60) return diffS + 's ago';
    if (diffS < 3600) return Math.floor(diffS / 60) + 'm ago';
    if (diffS < 86400) return Math.floor(diffS / 3600) + 'h ago';
    return Math.floor(diffS / 86400) + 'd ago';
  }

  function fullTime(ts) {
    return new Date(ts).toLocaleString();
  }

  function badgeHTML(status) {
    var cls = 'badge badge-' + status;
    if (status === 'deploying') return '<span class="' + cls + '" data-testid="status-badge"><span class="spinner"></span>deploying</span>';
    if (status === 'rolled_back_unhealthy') {
      // Two stacked lines at a reduced size: the full wording must stay
      // recognizable but overflows the status column on one line. Spans
      // instead of <br> because the badge is a flex container (column).
      return '<span class="' + cls + '" data-testid="status-badge"><span>rolled back</span><span>unhealthy</span></span>';
    }
    var label = status === 'rolled_back' ? 'rolled back' : status;
    return '<span class="' + cls + '" data-testid="status-badge">' + label + '</span>';
  }

  function filesHTML(files) {
    if (!files || files.length === 0) return '<span class="cell-duration">\u2014</span>';
    // escapeAttr also encodes quotes - JSON is full of them and this lands
    // inside a double-quoted attribute.
    var encoded = escapeAttr(JSON.stringify(files));
    var html = '<button class="files-pill" data-testid="files-pill" data-files="' + encoded + '">';
    html += '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h5l2 2h5v7H2z"/></svg>';
    html += files.length + ' file' + (files.length > 1 ? 's' : '');
    html += '</button>';
    return html;
  }

  function createFilesPanel(files) {
    var el = document.createElement('div');
    el.className = 'files-list';
    el.dataset.testid = 'files-panel';
    el.innerHTML = files.map(function(f) {
      return '<span class="file-path">' + escapeHtml(f) + '</span>';
    }).join('<br>');
    return el;
  }

  function classifyDiffLine(line) {
    if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('diff ') || line.startsWith('index ')) return 'diff-meta';
    if (line.startsWith('@@')) return 'diff-hunk';
    if (line.startsWith('+')) return 'diff-add';
    if (line.startsWith('-')) return 'diff-del';
    return '';
  }

  function renderDiffContent(diff) {
    return diff.split('\n').map(function(line) {
      var cls = classifyDiffLine(line);
      return '<span class="diff-line' + (cls ? ' ' + cls : '') + '">' + escapeHtml(line) + '</span>';
    }).join('\n');
  }

  function renderDiffPanel(diffs) {
    var el = document.createElement('div');
    el.className = 'diff-panel';
    el.dataset.testid = 'diff-panel';
    var files = Object.keys(diffs);
    var singleFile = files.length === 1;
    el.innerHTML = files.map(function(f) {
      var name = f.split('/').pop() || f;
      return '<div class="diff-file-section">' +
        '<div class="diff-file-header' + (singleFile ? ' expanded' : '') + '">' +
        '<svg viewBox="0 0 10 10"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>' +
        '<span>' + escapeHtml(name) + '</span></div>' +
        '<div class="diff-content">' + renderDiffContent(diffs[f]) + '</div>' +
        '</div>';
    }).join('');
    return el;
  }

  var diffCache = {};

  function fetchDiffs(eventId, callback) {
    if (diffCache[eventId]) {
      callback(diffCache[eventId]);
      return;
    }
    fetch('/api/events/' + eventId + '/diffs')
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        if (data && data.diffs) {
          diffCache[eventId] = data.diffs;
          callback(data.diffs);
        } else {
          callback(null);
        }
      })
      .catch(function() { callback(null); });
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // escapeAttr escapes for use inside a double-quoted HTML attribute:
  // like escapeHtml, but quotes must be encoded too.
  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, '&quot;');
  }

  function rowClass(status, isHistory) {
    var cls = 'event-row';
    if (status === 'deploying') cls += ' deploying-row';
    if (status === 'failed') cls += ' failed-row';
    if (status === 'success') cls += ' success-row';
    if (status === 'rolled_back') cls += ' rolled_back-row';
    if (status === 'rolled_back_unhealthy') cls += ' rolled_back_unhealthy-row';
    if (status === 'queued') cls += ' queued-row';
    if (!isHistory) cls += ' new-row';
    return cls;
  }

  // Bumped on refresh to bust the browser cache of icon images.
  var iconVer = 0;

  function iconURL(stack) {
    return '/api/icons/' + encodeURIComponent(stack) + (iconVer ? '?v=' + iconVer : '');
  }

  // populateIcon fills a .stack-icon chip with the stack's image, swapping to a
  // monogram if the request fails (unknown stack, no match, or offline).
  function populateIcon(chip, stack) {
    if (!chip) return;
    chip.classList.remove('mono');
    chip.textContent = '';
    var img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    img.addEventListener('error', function() { iconFallback(chip, stack); });
    img.src = iconURL(stack);
    chip.appendChild(img);
  }

  function iconFallback(chip, stack) {
    chip.classList.add('mono');
    chip.textContent = (stack || '?').charAt(0);
  }

  // refreshIcons clears the server cache, then reloads every visible icon so
  // renamed stacks and newly published icons appear.
  function refreshIcons() {
    fetch('/api/icons/refresh', { method: 'POST' }).finally(function() {
      iconVer = Date.now();
      document.querySelectorAll('.stack-icon').forEach(function(chip) {
        populateIcon(chip, chip.dataset.name);
      });
    });
  }

  // pausedTagHTML renders the "paused" tag on a queued deploy row, adding the
  // reason (global/stack) when the queue snapshot for that stack is known.
  function pausedTagHTML(stack) {
    var item = queueByStack[stack];
    var reason = item && item.reason;
    return '<span class="paused-tag">' + (reason ? 'paused: ' + reason : 'paused') + '</span>';
  }

  function createRow(evt, isHistory) {
    var row = document.createElement('div');
    row.className = rowClass(evt.status, isHistory);
    row.dataset.testid = 'deploy-row';
    row.dataset.stack = evt.stack;
    row.dataset.status = evt.status;
    row.dataset.eventId = evt.id;
    if (evt.has_diffs) row.dataset.hasDiffs = '1';

    var absTs = fullTime(evt.timestamp);
    var relTs = formatTime(evt.timestamp);
    var pausedTag = evt.status === 'queued' ? pausedTagHTML(evt.stack) : '';
    row.innerHTML =
      '<span class="cell-time" data-testid="time-cell" data-ts="' + evt.timestamp + '" title="' + (absoluteTime ? relTs : absTs) + '">' + (absoluteTime ? absTs : relTs) + '</span>' +
      '<span class="cell-stack"><span class="stack-icon" data-testid="stack-icon" data-name="' + escapeHtml(evt.stack) + '"></span><span class="stack-name">' + escapeHtml(evt.stack) + '</span>' + pausedTag + '</span>' +
      '<span class="status-cell">' + badgeHTML(evt.status) + '</span>' +
      '<span class="cell-duration" data-testid="duration-cell">' + formatDuration(evt.duration_ms) + '</span>' +
      '<span class="col-files">' + filesHTML(evt.changed_files) + '</span>';

    populateIcon(row.querySelector('.stack-icon'), evt.stack);
    return row;
  }

  function createErrorDetail(evt) {
    var el = document.createElement('div');
    el.className = 'error-detail';
    el.dataset.testid = 'error-panel';
    el.dataset.errorFor = evt.stack;
    el.textContent = evt.error;
    return el;
  }

  function updateDeployingIndicator() {
    var active = Object.keys(deployingRows);
    if (active.length > 0) {
      deployStatus.className = 'deploy-status active';
      deployStatus.querySelector('span').textContent = active.join(', ');
    } else {
      deployStatus.className = 'deploy-status';
      deployStatus.querySelector('span').textContent = 'idle';
    }
    // Mirror the text into title/aria so it survives when the span is hidden
    // on mobile (the dot alone stays visible — see UI_SPEC §Responsive).
    var label = active.length > 0 ? 'deploying ' + active.join(', ') : 'idle';
    deployStatus.title = label;
    deployStatus.setAttribute('aria-label', label);
  }

  // removeQueuedRow drops a stack's pending (queued) row and any panel opened
  // below it. No-op when the stack has no queued row.
  function removeQueuedRow(stack) {
    var row = queuedRows[stack];
    if (!row) return;
    var sib = row.nextElementSibling;
    if (sib && (sib.classList.contains('files-list') || sib.classList.contains('diff-panel'))) {
      sib.remove();
    }
    row.remove();
    delete queuedRows[stack];
  }

  function handleEvent(evt, isHistory) {
    // A skipped deploy means an unchanged stack — no signal worth showing, so
    // it is never rendered (skipped events are live-only, never in history).
    if (evt.status === 'skipped') return;

    showTable();

    if (evt.status === 'queued') {
      // Replace any prior pending row for this stack — multiple pushes while
      // paused collapse into one — and key it so it can be cleared on deploy.
      removeQueuedRow(evt.stack);
      var qrow = createRow(evt, isHistory);
      tbody.insertBefore(qrow, tbody.firstChild);
      queuedRows[evt.stack] = qrow;
      return;
    }

    // Any real deploy progress supersedes this stack's pending row.
    removeQueuedRow(evt.stack);

    if (evt.status === 'deploying') {
      var row = createRow(evt, isHistory);
      tbody.insertBefore(row, tbody.firstChild);
      deployingRows[evt.stack] = row;
      updateDeployingIndicator();
      return;
    }

    if ((evt.status === 'success' || evt.status === 'failed' || evt.status === 'rolled_back' || evt.status === 'rolled_back_unhealthy') && deployingRows[evt.stack]) {
      var existing = deployingRows[evt.stack];
      existing.className = rowClass(evt.status, isHistory);
      existing.dataset.status = evt.status;
      existing.dataset.eventId = evt.id;
      if (evt.has_diffs) existing.dataset.hasDiffs = '1';
      existing.querySelector('.status-cell').innerHTML = badgeHTML(evt.status);
      existing.querySelector('.cell-duration').textContent = formatDuration(evt.duration_ms);
      var tc = existing.querySelector('.cell-time');
      tc.dataset.ts = evt.timestamp;
      tc.textContent = absoluteTime ? fullTime(evt.timestamp) : formatTime(evt.timestamp);
      tc.title = absoluteTime ? formatTime(evt.timestamp) : fullTime(evt.timestamp);
      if (evt.changed_files && evt.changed_files.length > 0) {
        existing.querySelector('.col-files').innerHTML = filesHTML(evt.changed_files);
      }
      if (evt.error) {
        existing.after(createErrorDetail(evt));
      }
      delete deployingRows[evt.stack];
      updateDeployingIndicator();
      return;
    }

    var row = createRow(evt, isHistory);
    tbody.insertBefore(row, tbody.firstChild);
    if (evt.error) {
      row.after(createErrorDetail(evt));
    }
  }

  setInterval(function() {
    if (!absoluteTime) {
      tbody.querySelectorAll('.cell-time').forEach(function(cell) {
        var abs = cell.dataset.ts;
        if (abs) cell.textContent = formatTime(abs);
      });
    }
  }, 30000);

  function connect() {
    connDot.className = 'indicator-dot warn';
    connText.textContent = 'connecting';
    connDot.parentElement.dataset.state = 'connecting';
    connDot.parentElement.title = 'connecting';

    var es = new EventSource('/api/events');

    es.onopen = function() {
      connDot.className = 'indicator-dot';
      connText.textContent = 'connected';
      connDot.parentElement.dataset.state = 'connected';
      connDot.parentElement.title = 'connected';
    };

    es.addEventListener('deploy', function(e) {
      var evt = JSON.parse(e.data);
      handleEvent(evt, false);
    });

    es.addEventListener('autosync', function(e) {
      autosyncSnap = JSON.parse(e.data);
      renderAutosync();
    });

    es.addEventListener('queue', function(e) {
      queueSnap = JSON.parse(e.data);
      queueByStack = {};
      (queueSnap.pending || []).forEach(function(it) { queueByStack[it.stack] = it; });
      // A stack that left the pending set without a deploy event (e.g. resumed
      // then found unchanged) must lose its now-stale queued row.
      Object.keys(queuedRows).forEach(function(stack) {
        if (!queueByStack[stack]) removeQueuedRow(stack);
      });
      renderAutosync();
    });

    es.onerror = function() {
      connDot.className = 'indicator-dot err';
      connText.textContent = 'reconnecting';
      connDot.parentElement.dataset.state = 'reconnecting';
      connDot.parentElement.title = 'reconnecting';
    };
  }

  // Time mode toggle (default: relative)
  const timeModeBtn = document.getElementById('time-mode');

  function applyTimeMode() {
    if (absoluteTime) {
      timeModeBtn.classList.add('active');
      timeModeBtn.title = 'Switch to relative time';
    } else {
      timeModeBtn.classList.remove('active');
      timeModeBtn.title = 'Switch to absolute time';
    }
    tbody.querySelectorAll('.cell-time').forEach(function(cell) {
      var ts = cell.dataset.ts;
      if (!ts) return;
      cell.textContent = absoluteTime ? fullTime(ts) : formatTime(ts);
      cell.title = absoluteTime ? formatTime(ts) : fullTime(ts);
    });
  }

  timeModeBtn.addEventListener('click', function() {
    absoluteTime = !absoluteTime;
    localStorage.setItem('timeMode', absoluteTime ? 'absolute' : 'relative');
    applyTimeMode();
  });

  applyTimeMode();

  // Icon refresh — the "i" hotkey clears the server-side icon cache and reloads
  // every visible icon. Intentionally hotkey-only (no header button): a manual
  // refresh is rarely needed, so it stays out of the header. The endpoint is
  // also reachable directly (POST /api/icons/refresh) for ops use.
  document.addEventListener('keydown', function(e) {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
    if (e.key === 'i') refreshIcons();
  });

  // Colour-scheme toggle (dark is the default; light is opt-in per browser).
  // Which palette (Catppuccin/Nord/Solarized/Gruvbox/Rosé Pine) is configured
  // server-side via ui_theme and baked into <html data-theme> — this toggle
  // only ever flips dark/light within that palette.
  const themeToggle = document.getElementById('theme-toggle');
  let lightTheme = localStorage.getItem('colorScheme') === 'light';

  function applyTheme() {
    document.documentElement.classList.toggle('light', lightTheme);
    themeToggle.classList.toggle('active', lightTheme);
    themeToggle.title = lightTheme ? 'Switch to dark theme' : 'Switch to light theme';
  }

  themeToggle.addEventListener('click', function() {
    lightTheme = !lightTheme;
    localStorage.setItem('colorScheme', lightTheme ? 'light' : 'dark');
    applyTheme();
  });

  applyTheme();

  // Theme picker — this browser only, and opt-in. It is wired up only when the
  // deployment enables the switcher (data-theme-switcher="on", baked in from
  // ui_theme_switcher); otherwise the picker is hidden, no override is applied,
  // and the block below never runs. Choosing a theme here never changes the
  // environment's configured ui_theme (data-server-theme, baked in at serve
  // time); it only persists a local override applied instantly (no reload:
  // every theme's CSS is always present, switching data-theme is enough).
  // Picking the server's own theme clears the override, so the page goes back
  // to following whatever the environment is configured for.
  if (document.documentElement.getAttribute('data-theme-switcher') === 'on') {
    const THEME_LABELS = { catppuccin: 'Catppuccin', nord: 'Nord', solarized: 'Solarized', gruvbox: 'Gruvbox', 'rose-pine': 'Rosé Pine' };
    const serverTheme = document.documentElement.getAttribute('data-server-theme');
    const themeSelect = document.getElementById('theme-select');
    const themeNotice = document.getElementById('theme-notice');
    const themeNoticeText = document.getElementById('theme-notice-text');
    let themeNoticeTimer = null;

    themeSelect.value = document.documentElement.getAttribute('data-theme');

    function updateThemeNotice() {
      clearTimeout(themeNoticeTimer);
      const override = localStorage.getItem('themeOverride');
      if (!override || override === serverTheme) {
        themeNotice.hidden = true;
        return;
      }
      themeNoticeText.textContent = 'Showing ' + (THEME_LABELS[override] || override) +
        ' in this browser — this environment is configured for ' + (THEME_LABELS[serverTheme] || serverTheme) + '.';
      themeNotice.hidden = false;
      themeNoticeTimer = setTimeout(function() { themeNotice.hidden = true; }, 6000);
    }

    themeSelect.addEventListener('change', function() {
      const chosen = themeSelect.value;
      document.documentElement.setAttribute('data-theme', chosen);
      if (chosen === serverTheme) {
        localStorage.removeItem('themeOverride');
      } else {
        localStorage.setItem('themeOverride', chosen);
      }
      updateThemeNotice();
    });

    document.getElementById('theme-notice-close').addEventListener('click', function() {
      clearTimeout(themeNoticeTimer);
      themeNotice.hidden = true;
    });

    updateThemeNotice(); // show on load if a saved override already differs from the server theme
  }

  // ── Autosync controls ──
  // State comes from the 'autosync' and 'queue' SSE events (initial snapshots
  // are sent on connect). The header control shows global state + pending count
  // and opens the drawer; the drawer holds the global switch, the ordered queue,
  // and a filterable per-stack switch list. Toggles POST to /api/autosync; the
  // server pushes back an 'autosync' event so other tabs stay in sync.
  const asBtn = document.getElementById('autosync-btn');
  const asCountEl = document.getElementById('autosync-count');
  const asDrawer = document.getElementById('autosync-drawer');
  const asSub = document.getElementById('autosync-sub');
  const asGlobalSw = document.getElementById('autosync-global-sw');
  const asGlobalNote = document.getElementById('autosync-global-note');
  const asQueueList = document.getElementById('autosync-queue-list');
  const asStackList = document.getElementById('autosync-stack-list');
  const asQCount = document.getElementById('autosync-qcount');
  const asFilter = document.getElementById('autosync-filter');
  const asFilterWrap = document.getElementById('autosync-filter-wrap');
  const asFilterClear = document.getElementById('autosync-filter-clear');

  function autosyncStacks() {
    return (autosyncSnap && autosyncSnap.stacks) || [];
  }

  function stackByName(name) {
    return autosyncStacks().filter(function(s) { return s.name === name; })[0];
  }

  function anyPaused() {
    if (!autosyncSnap) return false;
    if (!autosyncSnap.global) return true;
    return autosyncStacks().some(function(s) { return !s.effective; });
  }

  function autosyncPost(scope, stack, enabled) {
    fetch('/api/autosync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scope: scope, stack: stack, enabled: enabled })
    }).then(function(r) { return r.ok ? r.json() : null; })
      .then(function(snap) { if (snap) { autosyncSnap = snap; renderAutosync(); } })
      .catch(function() {});
  }

  // reasonFromSnap derives why a paused stack is paused when it is not in the
  // queue (the queue item carries an authoritative reason of its own).
  function reasonFromSnap(s) {
    if (s.effective) return '';
    if (s.overridden || s.config === false) return 'stack';
    return 'global';
  }

  function waited(since) {
    var diffS = Math.floor((Date.now() - new Date(since).getTime()) / 1000);
    if (diffS < 60) return diffS + 's';
    if (diffS < 3600) return Math.floor(diffS / 60) + 'm';
    if (diffS < 86400) return Math.floor(diffS / 3600) + 'h';
    return Math.floor(diffS / 86400) + 'd';
  }

  function stackDetail(s, item) {
    if (item) {
      var n = item.changed_files ? item.changed_files.length : 0;
      return '<span class="warn">' + n + ' file' + (n === 1 ? '' : 's') + '</span> · waiting <span data-testid="wait-cell">' + waited(item.since) + '</span>';
    }
    if (!s.effective) return 'paused · no changes';
    return 'synced';
  }

  function stackRowHTML(s, pos) {
    var item = queueByStack[s.name];
    var queued = !!item;
    // pos is a number only in the queue list; the all-stacks list passes null.
    var inQueue = pos !== null;
    var posCell = inQueue
      ? '<div class="qpos">' + pos + '</div>'
      : '<div class="qpos blank">' + (queued ? '●' : '') + '</div>';
    var reason = item ? item.reason : reasonFromSnap(s);
    var chip = (!s.effective && reason) ? '<span class="reason reason-' + reason + '">' + reason + '</span>' : '';
    var rowTestid = inQueue ? 'queue-item' : 'stack-item';
    // The stack switch is the interactive control the tests toggle; only tag it
    // in the all-stacks list so a queued stack does not expose two of them.
    var swTestid = inQueue ? '' : ' data-testid="stack-switch"';
    return '<div class="stack-row" data-testid="' + rowTestid + '" data-stack="' + escapeAttr(s.name) + '">' +
        posCell +
        '<div class="stack-meta">' +
          '<div class="stack-name">' + escapeHtml(s.name) + chip + '</div>' +
          '<div class="stack-detail">' + stackDetail(s, item) + '</div>' +
        '</div>' +
        '<div class="sw' + (s.effective ? ' on' : '') + '"' + swTestid + ' role="switch" aria-checked="' + s.effective +
          '" tabindex="0" data-stack="' + escapeAttr(s.name) + '" title="' + (s.effective ? 'Pause' : 'Resume') + ' autosync"></div>' +
      '</div>';
  }

  function renderAutosyncBtn() {
    var count = queueSnap.count || 0;
    asBtn.classList.toggle('has-pending', count > 0);
    asBtn.classList.toggle('paused', anyPaused());
    if (autosyncSnap) asBtn.dataset.global = String(autosyncSnap.global);
    asCountEl.textContent = count;
    asBtn.title = count > 0
      ? count + ' stack' + (count === 1 ? '' : 's') + ' queued — autosync paused'
      : 'Autosync — all in sync';
  }

  function renderSub() {
    var paused = autosyncStacks().filter(function(s) { return !s.effective; }).length;
    var q = queueSnap.count || 0;
    if (q === 0 && paused === 0) asSub.textContent = 'All stacks in sync.';
    else if (q === 0) asSub.textContent = paused + ' stack' + (paused === 1 ? '' : 's') + ' paused · nothing waiting.';
    else asSub.innerHTML = '<b>' + q + '</b> update' + (q === 1 ? '' : 's') + ' waiting · ' + paused + ' stack' + (paused === 1 ? '' : 's') + ' paused.';
  }

  function renderGlobal() {
    if (!autosyncSnap) return;
    asGlobalSw.classList.toggle('on', autosyncSnap.global);
    asGlobalSw.setAttribute('aria-checked', String(autosyncSnap.global));
    asGlobalNote.textContent = autosyncSnap.global
      ? 'on · deploys apply automatically'
      : 'off · stacks pause unless individually enabled';
  }

  function renderQueueList() {
    var pending = queueSnap.pending || [];
    asQCount.textContent = pending.length ? '(' + pending.length + ')' : '';
    if (pending.length === 0) {
      asQueueList.innerHTML = '<div class="qempty">Nothing queued — resumed deploys apply immediately.</div>';
      return;
    }
    asQueueList.innerHTML = pending.map(function(it) {
      var s = stackByName(it.stack) || { name: it.stack, effective: false, overridden: false, config: null };
      return stackRowHTML(s, it.position);
    }).join('');
  }

  function renderStackList() {
    var query = (asFilter.value || '').trim().toLowerCase();
    asFilterWrap.classList.toggle('has-value', query.length > 0);
    var stacks = autosyncStacks();
    var list = stacks.filter(function(s) { return s.name.toLowerCase().indexOf(query) !== -1; });
    if (list.length === 0) {
      asStackList.innerHTML = '<div class="qempty">' +
        (stacks.length ? 'No stack matches “' + escapeHtml(query) + '”.' : 'No stacks.') + '</div>';
      return;
    }
    asStackList.innerHTML = list.map(function(s) { return stackRowHTML(s, null); }).join('');
  }

  function renderAutosync() {
    renderAutosyncBtn();
    renderGlobal();
    renderQueueList();
    renderStackList();
    renderSub();
  }

  function setDrawer(open) {
    if (open) setViewOptions(false); // the two popovers are mutually exclusive
    asDrawer.classList.toggle('open', open);
    asBtn.classList.toggle('open', open);
    asBtn.setAttribute('aria-expanded', String(open));
  }

  asBtn.addEventListener('click', function() { setDrawer(!asDrawer.classList.contains('open')); });
  asBtn.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); asBtn.click(); }
  });

  asGlobalSw.addEventListener('click', function() {
    if (autosyncSnap) autosyncPost('global', '', !autosyncSnap.global);
  });
  asGlobalSw.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); asGlobalSw.click(); }
  });

  // Per-stack switches are event-delegated so re-rendering the lists is cheap.
  function toggleFromEvent(target) {
    var sw = target.closest ? target.closest('.sw[data-stack]') : null;
    if (!sw) return false;
    autosyncPost('stack', sw.getAttribute('data-stack'), !sw.classList.contains('on'));
    return true;
  }
  asDrawer.addEventListener('click', function(e) { toggleFromEvent(e.target); });
  asDrawer.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      if (toggleFromEvent(e.target)) e.preventDefault();
    }
  });

  asFilter.addEventListener('input', renderStackList);
  asFilter.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && asFilter.value) { e.stopPropagation(); asFilter.value = ''; renderStackList(); }
  });
  asFilterClear.addEventListener('click', function() { asFilter.value = ''; renderStackList(); asFilter.focus(); });

  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') setDrawer(false); });
  document.addEventListener('click', function(e) {
    if (!asDrawer.classList.contains('open')) return;
    if (asDrawer.contains(e.target) || asBtn.contains(e.target)) return;
    setDrawer(false);
  });

  renderAutosync(); // initial paint before the first SSE snapshot arrives

  // ── Logs view ──
  // The log stream connects lazily on first activation and stays open;
  // the connection indicator remains bound to /api/events.
  const logPane = document.getElementById('log-pane');
  const followBtn = document.getElementById('follow-logs');
  const sortBtn = document.getElementById('log-sort');
  const viewButtons = document.querySelectorAll('#view-toggle button');

  // The log view keeps a bounded client-side buffer (the backend replays at
  // most its own ring on connect) and renders a sliding window of it. Default
  // order is newest-first (descending); the sort toggle flips it. The window
  // starts at logPageSize lines and grows by logPageSize each time the user
  // scrolls to the older edge.
  const logPageSize = 500;
  const maxLogBuffer = 2000;
  let logEntries = [];            // chronological, oldest → newest
  let logVisible = logPageSize;   // number of newest entries currently rendered
  let logDescending = localStorage.getItem('logSort') !== 'asc'; // default: newest first
  let followLogs = localStorage.getItem('followLogs') !== 'false';
  let activeView = localStorage.getItem('activeView') === 'logs' ? 'logs' : 'deploys';
  let logSource = null;

  function levelClass(level) {
    return ['DEBUG', 'INFO', 'WARN', 'ERROR'].indexOf(level) >= 0 ? level : 'INFO';
  }

  // logTime shows the time of day; lines from another day get a date
  // prefix. The full timestamp is always in the tooltip.
  function logTime(ts) {
    var d = new Date(ts);
    var t = d.toLocaleTimeString();
    if (d.toDateString() !== new Date().toDateString()) {
      return d.toLocaleDateString() + ' ' + t;
    }
    return t;
  }

  function renderLogLine(entry) {
    var line = document.createElement('div');
    line.className = 'log-line';
    line.dataset.testid = 'log-line';
    var attrs = entry.attrs || {};
    var html = '<span class="log-time" title="' + escapeAttr(new Date(entry.time).toLocaleString()) + '">' + escapeHtml(logTime(entry.time)) + '</span>';
    if (attrs.cmd && attrs.stream) {
      // Child process output: slate [cmd] prefix instead of a level badge.
      line.dataset.level = 'cmd';
      html += '<span class="log-cmd" data-testid="cmd-prefix">[' + escapeHtml(attrs.cmd) + ']</span>';
      html += '<span class="log-msg">' + escapeHtml(entry.msg) + '</span>';
    } else {
      line.dataset.level = entry.level;
      html += '<span class="log-level ' + levelClass(entry.level) + '" data-testid="level-badge">' + escapeHtml(entry.level) + '</span>';
      // The stack attr says which stack a deploy line belongs to — render
      // it as a prominent prefix instead of burying it in the attrs blob.
      if (attrs.stack) {
        html += '<span class="log-stack" data-testid="stack-prefix">[' + escapeHtml(attrs.stack) + ']</span>';
      }
      html += '<span class="log-msg">' + escapeHtml(entry.msg) + '</span>';
      // Deploy completion lines carry the deploy event's ID — render a
      // pill that loads the deploy's diff below the line on demand.
      if (attrs.event_id) {
        html += '<button class="files-pill log-diff-pill" data-testid="diff-pill" data-event-id="' + escapeAttr(attrs.event_id) + '">diff</button>';
      }
      var pairs = Object.keys(attrs).filter(function(k) {
        return k !== 'stack' && k !== 'event_id';
      }).map(function(k) {
        return escapeHtml(k) + '=' + escapeHtml(attrs[k]);
      });
      if (pairs.length > 0) html += '<span class="log-attrs">' + pairs.join(' ') + '</span>';
    }
    line.innerHTML = html;
    return line;
  }

  // Diff pill in the log view — same fetch/render/toggle behaviour as the
  // files pill in the deploy table, but anchored below the log line.
  logPane.addEventListener('click', function(e) {
    var fileHeader = e.target.closest('.diff-file-header');
    if (fileHeader) {
      fileHeader.classList.toggle('expanded');
      return;
    }

    var pill = e.target.closest('.log-diff-pill');
    if (!pill) return;
    var line = pill.closest('.log-line');
    var existing = line.nextElementSibling;
    if (existing && (existing.classList.contains('diff-panel') || existing.classList.contains('files-list'))) {
      existing.remove();
      return;
    }
    fetchDiffs(pill.dataset.eventId, function(diffs) {
      if (diffs && Object.keys(diffs).length > 0) {
        line.after(renderDiffPanel(diffs));
      } else {
        var note = document.createElement('div');
        note.className = 'files-list';
        note.textContent = 'No diff recorded for this deploy.';
        line.after(note);
      }
    });
  });

  // The newest line lives at the top when descending, the bottom when
  // ascending; "follow" and fresh renders pin the view to that edge.
  function scrollToNewest() {
    logPane.scrollTop = logDescending ? 0 : logPane.scrollHeight;
  }

  // Remove a rendered line together with any diff/files panel opened below it,
  // so trimming the window never leaves an orphaned panel behind.
  function removeLogLine(line) {
    var next = line.nextElementSibling;
    if (next && (next.classList.contains('diff-panel') || next.classList.contains('files-list'))) {
      next.remove();
    }
    line.remove();
  }

  // Keep at most logVisible rendered lines, dropping from the older edge
  // (bottom when descending, top when ascending). The dropped entries stay in
  // the buffer, so scrolling back can reveal them again.
  function trimLogDom() {
    var lines = logPane.querySelectorAll('.log-line');
    var over = lines.length - logVisible;
    for (var i = 0; i < over; i++) {
      removeLogLine(logDescending ? lines[lines.length - 1 - i] : lines[i]);
    }
  }

  // Rebuild the pane from the buffer for the current order and window size.
  // Used on view activation, sort toggle and other non-incremental changes.
  function renderLogWindow() {
    logPane.innerHTML = '';
    if (logEntries.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'log-empty';
      empty.id = 'log-empty';
      empty.textContent = 'Awaiting log output...';
      logPane.appendChild(empty);
      return;
    }
    var count = Math.min(logVisible, logEntries.length);
    var slice = logEntries.slice(logEntries.length - count); // oldest → newest
    if (logDescending) slice.reverse();
    var frag = document.createDocumentFragment();
    slice.forEach(function(e) { frag.appendChild(renderLogLine(e)); });
    logPane.appendChild(frag);
    scrollToNewest();
  }

  // Reveal another page of older entries at the older edge, preserving the
  // reading position. No-op once the whole buffer is rendered.
  function loadMoreLogs() {
    var have = Math.min(logVisible, logEntries.length);
    var target = Math.min(logVisible + logPageSize, maxLogBuffer, logEntries.length);
    if (target <= have) return;
    logVisible = target;
    var older = logEntries.slice(logEntries.length - target, logEntries.length - have);
    var frag = document.createDocumentFragment();
    if (logDescending) {
      older.reverse(); // append newest → oldest at the bottom
      older.forEach(function(e) { frag.appendChild(renderLogLine(e)); });
      logPane.appendChild(frag); // grows below the fold; scrollTop unchanged
    } else {
      var prevHeight = logPane.scrollHeight, prevTop = logPane.scrollTop;
      older.forEach(function(e) { frag.appendChild(renderLogLine(e)); }); // oldest → newest
      logPane.insertBefore(frag, logPane.firstChild);
      logPane.scrollTop = prevTop + (logPane.scrollHeight - prevHeight);
    }
  }

  // A single fresh (newest) line arrived over the stream.
  function appendNewestToDom(entry) {
    var empty = logPane.querySelector('.log-empty');
    if (empty) empty.remove();
    var node = renderLogLine(entry);
    if (logDescending) {
      logPane.insertBefore(node, logPane.firstChild);
    } else {
      logPane.appendChild(node);
    }
    trimLogDom();
    if (followLogs) scrollToNewest();
  }

  function pushLog(entry) {
    logEntries.push(entry);
    var overflow = logEntries.length - maxLogBuffer;
    if (overflow > 0) logEntries.splice(0, overflow);
    // While the logs view is hidden we only buffer; the pane is rebuilt from
    // the buffer when the view is next activated.
    if (activeView === 'logs') appendNewestToDom(entry);
  }

  logPane.addEventListener('scroll', function() {
    var nearOlderEdge = logDescending
      ? logPane.scrollTop + logPane.clientHeight >= logPane.scrollHeight - 40
      : logPane.scrollTop <= 40;
    if (nearOlderEdge) loadMoreLogs();
  });

  function connectLogs() {
    if (logSource) return;
    logSource = new EventSource('/api/logs');
    logSource.addEventListener('log', function(e) {
      pushLog(JSON.parse(e.data));
    });
  }

  function applyView() {
    document.body.classList.toggle('view-logs', activeView === 'logs');
    viewButtons.forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.view === activeView);
    });
    if (activeView === 'logs') {
      connectLogs();
      renderLogWindow();
    }
  }

  // View-specific options (time mode / sort / follow) live in a popover behind
  // the view buttons so the header never gains or loses controls on a view
  // switch. Clicking the already-active view button toggles that popover;
  // clicking the other button switches views (and closes the popover).
  const viewSwitch = document.getElementById('view-switch');
  const viewOptions = document.getElementById('view-options');

  function setViewOptions(open) {
    if (open) setDrawer(false); // mutually exclusive with the autosync drawer
    viewOptions.classList.toggle('open', open);
    viewButtons.forEach(function(btn) {
      if (btn.dataset.view === activeView) btn.setAttribute('aria-expanded', String(open));
    });
  }

  viewButtons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (btn.dataset.view === activeView) {
        setViewOptions(!viewOptions.classList.contains('open'));
        return;
      }
      activeView = btn.dataset.view;
      localStorage.setItem('activeView', activeView);
      setViewOptions(false);
      applyView();
    });
  });

  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') setViewOptions(false); });
  document.addEventListener('click', function(e) {
    if (!viewOptions.classList.contains('open')) return;
    if (viewSwitch.contains(e.target)) return; // clicks on the buttons/options manage themselves
    setViewOptions(false);
  });

  function applyFollow() {
    followBtn.classList.toggle('active', followLogs);
    if (followLogs) scrollToNewest();
  }

  followBtn.addEventListener('click', function() {
    followLogs = !followLogs;
    localStorage.setItem('followLogs', String(followLogs));
    applyFollow();
  });

  // Sort toggle: active = oldest-first (ascending). Flipping restarts the
  // window at one page in the new order.
  sortBtn.addEventListener('click', function() {
    logDescending = !logDescending;
    localStorage.setItem('logSort', logDescending ? 'desc' : 'asc');
    sortBtn.classList.toggle('active', !logDescending);
    sortBtn.title = logDescending ? 'Show oldest log lines first' : 'Show newest log lines first';
    logVisible = logPageSize;
    renderLogWindow();
  });

  sortBtn.classList.toggle('active', !logDescending);
  sortBtn.title = logDescending ? 'Show oldest log lines first' : 'Show newest log lines first';
  applyFollow();
  applyView();

  // Files panel — open/close as full-width sibling below the row.
  // When diffs are available, shows a diff panel; otherwise shows file list.
  tbody.addEventListener('click', function(e) {
    // Handle diff file section collapse/expand
    var fileHeader = e.target.closest('.diff-file-header');
    if (fileHeader) {
      fileHeader.classList.toggle('expanded');
      return;
    }

    var pill = e.target.closest('.files-pill');
    var row = pill ? pill.closest('.event-row') : e.target.closest('.event-row');
    if (!row) return;
    var pillEl = pill || row.querySelector('.files-pill');
    if (!pillEl) return;
    var existing = row.nextElementSibling;
    if (existing && (existing.classList.contains('files-list') || existing.classList.contains('diff-panel'))) {
      existing.remove();
      return;
    }

    var eventId = row.dataset.eventId;
    var hasDiffs = row.dataset.hasDiffs === '1';

    if (hasDiffs && eventId) {
      var loading = document.createElement('div');
      loading.className = 'diff-panel';
      loading.innerHTML = '<div class="diff-loading">Loading diffs...</div>';
      row.after(loading);
      fetchDiffs(eventId, function(diffs) {
        if (loading.parentNode) loading.remove();
        if (diffs && Object.keys(diffs).length > 0) {
          row.after(renderDiffPanel(diffs));
        } else {
          var files = JSON.parse(pillEl.dataset.files);
          row.after(createFilesPanel(files));
        }
      });
    } else {
      var files = JSON.parse(pillEl.dataset.files);
      row.after(createFilesPanel(files));
    }
  });

  // Paint the deployed skipper-cd build identity in the header once on load.
  // Feature-branch builds show the branch (which release semver alone cannot
  // distinguish); release/Nix/dev builds show the version. The short commit is
  // appended whenever the build path knows it.
  fetch('/api/version')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d || !d.version) return;
      var el = document.getElementById('brand-version');
      if (!el) return;
      var base = d.version === 'dev' ? 'dev' : 'v' + d.version;
      var head = (d.branch && d.branch !== 'main') ? d.branch : base;
      var text = d.commit ? head + ' · ' + d.commit : head;
      el.textContent = text;
      // The label may be clipped (ellipsis) on narrow viewports or long branch
      // names; the title exposes the full identity on hover / long-press.
      el.title = text;
    })
    .catch(function() {});

  // Tap-reveal tooltips for touch: title attributes never show on touch, so a
  // tap on any header control flashes its title in a bubble. Mouse/pen keep the
  // native tooltip (we only handle touch pointers), avoiding a double tooltip.
  (function setupTapTips() {
    var header = document.querySelector('header');
    if (!header) return;
    var tip = document.createElement('div');
    tip.className = 'tap-tip';
    tip.setAttribute('aria-hidden', 'true');
    document.body.appendChild(tip);
    var hideTimer = null;
    function hide() { tip.classList.remove('show'); }
    header.addEventListener('pointerdown', function(e) {
      if (e.pointerType && e.pointerType !== 'touch') return; // mouse/pen: native tooltip
      var el = e.target.closest && e.target.closest('[title]');
      if (!el || !header.contains(el)) return;
      if (el.closest('.view-options')) return; // popover rows already show labels
      var text = el.getAttribute('title');
      if (!text) return;
      tip.textContent = text;
      // Render off-screen first to measure, then centre under the control and
      // clamp to the viewport so it never overflows the edges.
      tip.style.left = '-9999px';
      tip.style.top = '0px';
      tip.classList.add('show');
      var r = el.getBoundingClientRect();
      var margin = 6;
      var left = r.left + r.width / 2 - tip.offsetWidth / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - tip.offsetWidth - margin));
      tip.style.left = left + 'px';
      tip.style.top = (r.bottom + 6) + 'px';
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hide, 1600);
    }, { passive: true });
    window.addEventListener('scroll', hide, { passive: true });
  })();

  connect();

  // Register the service worker for installability + app-shell caching.
  // Failure-tolerant: an insecure context (plain HTTP) simply skips it, the
  // page keeps working as a normal site. See docs/pwa.md.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js').catch(function() {});
    });
  }
})();
</script>
