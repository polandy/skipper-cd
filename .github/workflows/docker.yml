name: Docker

on:
  push:
    tags:
      - "v*"
    # Feature-branch pushes publish a branch-slug + sha image so a branch build
    # can be deployed and identified in the UI header. main is excluded (its
    # image ships via the release tag); release-please PR branches are noise.
    branches-ignore:
      - main
      - "release-please--**"
  # release-please creates the tag with a PAT, so the push event above fires
  # automatically. Kept for manual re-runs against a specific tag.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver tags apply only on v* tag builds; branch builds get the
          # branch-slug tag (type=ref) plus type=sha. latest is pinned to tag
          # builds so a feature branch never overwrites it.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the build identity into the binary (Dockerfile strips .git, so
          # the running binary cannot recover it). BRANCH is set only for real
          # branch refs — a tag build leaves it empty so the UI shows the version.
          build-args: |
            COMMIT=${{ github.sha }}
            BRANCH=${{ github.ref_type == 'branch' && github.ref_name || '' }}
