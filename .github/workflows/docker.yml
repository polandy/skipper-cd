name: Docker

on:
  push:
    tags:
      - "v*"
    # Feature-branch pushes publish a branch-slug + sha image so a branch build
    # can be deployed and identified in the UI header. main is excluded (its
    # image ships via the release tag); release-please PR branches are noise.
    branches-ignore:
      - main
      - "release-please--**"
  # release-please creates the tag with a PAT, so the push event above fires
  # automatically. Kept for manual re-runs against a specific tag.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A release image ships only from a commit the full CI passed on, rerun on
  # the tag itself: main's own run can be cancelled by the next merge.
  ci:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    # Branch builds skip the gate; a failed or cancelled gate stops a tag build.
    if: ${{ !cancelled() && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && github.ref_type != 'tag')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver tags apply only on v* tag builds; branch builds get the
          # branch-slug tag (type=ref) plus type=sha. latest is pinned to tag
          # builds so a feature branch never overwrites it.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the build identity into the binary (Dockerfile strips .git, so
          # the running binary cannot recover it). BRANCH is set only for real
          # branch refs — a tag build leaves it empty so the UI shows the version.
          build-args: |
            COMMIT=${{ github.sha }}
            BRANCH=${{ github.ref_type == 'branch' && github.ref_name || '' }}
