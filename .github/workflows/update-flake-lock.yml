# Dependabot cannot update Nix flake inputs, so a weekly job opens a PR
# with a refreshed flake.lock instead.
#
# PRs created with the default GITHUB_TOKEN do not trigger CI runs — a GitHub
# restriction on workflow-authored PRs, not a bug here. Close and reopen the PR
# to get a real run, and only merge once it is green. The action states this in
# every PR body it opens, so the instruction reaches whoever has to act on it
# without being restated here; this note exists so the missing checks are not
# read as a broken workflow.
#
# Lifting the restriction would mean granting a PAT or GitHub App token repo
# write access as a long-lived secret. Not worth it for a weekly lockfile bump:
# reopening a PR is cheaper than holding that credential.
name: Update flake.lock

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/update-flake-lock@v28
        with:
          pr-title: "chore(nix): update flake.lock"
          commit-msg: "chore(nix): update flake.lock"
