# Dependabot cannot update Nix flake inputs, so a weekly job opens a PR
# with a refreshed flake.lock instead.
#
# Runbook: PRs created with the default GITHUB_TOKEN do not trigger CI runs
# (a GitHub restriction on workflow-authored PRs, not a bug here). When this
# job opens a PR, close it and reopen it (or push an empty commit) to make CI
# run before merging. A permanent fix would need a PAT or GitHub App token
# with repo write access wired in as a secret.
name: Update flake.lock

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/update-flake-lock@v28
        with:
          pr-title: "chore(nix): update flake.lock"
          commit-msg: "chore(nix): update flake.lock"
