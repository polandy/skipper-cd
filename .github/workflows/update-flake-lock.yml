# Dependabot cannot update Nix flake inputs, so a weekly job opens a PR
# with a refreshed flake.lock instead.
#
# A PR pushed with GITHUB_TOKEN triggers no pull_request run (a GitHub rule
# against workflow recursion), but workflow_dispatch is exempt from that rule.
# So the job dispatches CI on the bot branch itself; its checks land on the
# head commit and show on the PR. Only merge once they are green.
#
# A PAT or GitHub App token would also lift the rule, but holds repo write
# access as a long-lived secret; the dispatch needs no credential at all.
name: Update flake.lock

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

env:
  BRANCH: update_flake_lock_action

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        id: update
        with:
          branch: ${{ env.BRANCH }}
          pr-title: "chore(nix): update flake.lock"
          commit-msg: "chore(nix): update flake.lock"
          pr-body: |
            Automated changes by the [update-flake-lock](https://github.com/DeterminateSystems/update-flake-lock) GitHub Action.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```

            CI is dispatched on this branch by the same workflow; merge once it is green.

      - if: steps.update.outputs.pull-request-operation == 'created' || steps.update.outputs.pull-request-operation == 'updated'
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
