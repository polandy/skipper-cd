name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test ./... -race -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      # The nix flake builds with vendorHash = null, so vendor/ must stay
      # committed and in sync with go.mod.
      - name: check vendor is in sync
        run: |
          go mod tidy
          go mod vendor
          git diff --exit-code

  # End-to-end tests: run the real skipper binary against a local git origin
  # and a stub docker on PATH (no docker daemon needed). Guarded by the "e2e"
  # build tag so they stay out of the fast `go test ./...` job above.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l e2e)"
      - run: go vet -tags e2e ./e2e
      - run: go test -tags e2e -v -count=1 ./e2e

  # UI end-to-end tests: Playwright drives the embedded web UI in a real browser
  # against the same skipper binary (built in globalSetup). It runs inside
  # Playwright's pinned container (matching @playwright/test in the lockfile) so
  # the browser + font rasterisation are identical to how the visual-snapshot
  # baselines were generated — RUN_SNAPSHOTS turns the pixel compares on
  # (docs/e2e-tests.md §5, §7). The image already ships Node + the browsers, so
  # only Go (for globalSetup's build) is installed on top.
  e2e-ui:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install UI E2E deps
        working-directory: e2e/ui
        run: npm ci
      - name: Run UI E2E
        working-directory: e2e/ui
        env:
          RUN_SNAPSHOTS: '1'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/ui/playwright-report/
            e2e/ui/test-results/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  # Reports known vulnerabilities in dependencies, filtered to those actually
  # reachable from called code — low-noise, meaningful for a tool that runs
  # deployments.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod

  # Verifies the image still builds and scans it for known CVEs. Without the
  # build check, base-image bumps from Dependabot would be untested on PRs —
  # docker.yml only builds on release.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t skipper-cd:ci .
      # ignore-unfixed keeps CVEs without an available patch from failing CI —
      # they are not actionable until upstream ships a fix.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: skipper-cd:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
