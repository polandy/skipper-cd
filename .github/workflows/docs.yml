# Builds the MkDocs Material site from docs/ and deploys it to GitHub Pages.
# Runs only when the docs, the MkDocs config, or this workflow change.
#
# On pull requests the build job runs `mkdocs build --strict` as a gate so a
# broken link or bad nav fails the PR instead of surfacing only after merge;
# the deploy job is push-to-main only.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      # Only the main-branch push needs to publish; PR runs stop at the strict
      # build above as a validation gate.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
